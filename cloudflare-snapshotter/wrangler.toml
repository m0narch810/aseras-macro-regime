name = "vanta-snapshotter"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# ── Cron triggers (UTC) ───────────────────────────────────────────────────────
# 1) Dispatch the GEX snapshot workflow every 5 min, Mon-Fri, 12:00-21:59 UTC
#    (~08:00-17:00 ET — covers pre-market through the RTH close incl. DST).
#    The GitHub workflow itself ET-gates and no-ops outside 03:00-17:00 ET, so a
#    stray dispatch is cheap. Cloudflare fires these reliably, unlike GitHub's
#    own */5 schedule which silently drops most ticks (~5 runs/day → ~108/day).
# 2) Daily heartbeat at 22:15 UTC (~18:15 ET, after the close) — counts the day's
#    snapshot commits and alerts if the pipeline went quiet (dead FF_SESSION,
#    expired token, etc.) so breakage surfaces within a day, not weeks.
[triggers]
crons = ["*/5 12-21 * * 1-5", "15 22 * * 1-5"]

[vars]
GITHUB_REPO      = "m0narch810/vanta"
WORKFLOW_FILE    = "gex-snapshot.yml"
WORKFLOW_REF     = "master"
SNAPSHOT_BRANCH  = "gex-snapshots"
HEARTBEAT_MIN    = "60"          # alert if fewer than this many snapshot commits land in a day
# HEARTBEAT_WEBHOOK is set as a secret (optional) — Discord/Slack-style incoming webhook.

# Secrets (set via `wrangler secret put`, NOT committed):
#   GITHUB_TOKEN       — fine-grained PAT, repo = vanta, Actions: Read and write
#   HEARTBEAT_WEBHOOK  — (optional) webhook URL for the daily health alert
