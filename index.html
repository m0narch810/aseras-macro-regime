<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vαntα · Futures Bias Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<script src="auth.js"></script>
<style>

/* ── TOKENS ──────────────────────────────────────── */
:root {
  --bg:          #060608;
  --bg-grid:     rgba(255,255,255,0.033);
  --surface:     rgba(255,255,255,0.032);
  --surface-hi:  rgba(255,255,255,0.058);

  --accent:      #c8d0dc;
  --accent-dim:  rgba(200,208,220,0.09);
  --accent-glow: rgba(200,208,220,0.14);
  --accent-sub:  rgba(200,208,220,0.55);

  --border:      rgba(255,255,255,0.088);
  --border-hi:   rgba(255,255,255,0.18);

  --text:  #f0f2f5;
  --muted: rgba(195,205,218,0.82);
  --ghost: rgba(170,182,198,0.72);

  --bull:      #34d399;
  --bull-dim:  rgba(52,211,153,0.08);
  --bull-b:    rgba(52,211,153,0.22);
  --bull-glow: rgba(52,211,153,0.28);

  --bear:      #f87171;
  --bear-dim:  rgba(248,113,113,0.08);
  --bear-b:    rgba(248,113,113,0.22);
  --bear-glow: rgba(248,113,113,0.28);

  --mixed:      #fbbf24;
  --mixed-dim:  rgba(251,191,36,0.08);
  --mixed-b:    rgba(251,191,36,0.18);
  --mixed-glow: rgba(251,191,36,0.24);

  --flip:      #f59e0b;
  --flip-dim:  rgba(245,158,11,0.10);
  --flip-b:    rgba(245,158,11,0.26);
  --flip-glow: rgba(245,158,11,0.30);
}

/* ── RESET ───────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

/* ── BASE ────────────────────────────────────────── */
body {
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--bg-grid) 1px, transparent 1px);
  background-size: 36px 36px;
  color: var(--text);
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  font-size: 12.5px;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── SCAN LINE ───────────────────────────────────── */
.scan-line {
  position: fixed; left: 0; width: 100%; height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,255,255,0.03) 15%,
    rgba(255,255,255,0.1) 50%,
    rgba(255,255,255,0.03) 85%,
    transparent 100%
  );
  pointer-events: none; z-index: 0;
  animation: scan 16s linear infinite;
}
@keyframes scan {
  0%   { top: -2px; opacity: 0; }
  5%   { opacity: 1; }
  95%  { opacity: 1; }
  100% { top: 100vh; opacity: 0; }
}

/* ── PAGE WRAPPER ────────────────────────────────── */
.pw { position: relative; z-index: 1; }

/* ── HEADER ──────────────────────────────────────── */
header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  padding: 14px 32px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  background: rgba(6,6,8,0.55);
  backdrop-filter: blur(40px) saturate(160%);
  -webkit-backdrop-filter: blur(40px) saturate(160%);
  box-shadow: 0 1px 0 rgba(255,255,255,0.05), 0 4px 24px rgba(0,0,0,0.4);
  position: sticky; top: 0; z-index: 100;
}

.brand {
  font-family: 'Syne', sans-serif;
  font-weight: 800; font-size: 18px;
  letter-spacing: 0.14em;
  color: var(--text);
  user-select: none;
  grid-column: 2;
  text-align: center;
}
.brand .alph {
  color: #ffffff;
  text-shadow: 0 0 16px rgba(255,255,255,0.35);
}

.header-right { display: flex; align-items: center; gap: 22px; justify-self: end; grid-column: 3; }

.hdr-tag {
  font-family: 'Syne', sans-serif;
  font-size: 8.5px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--ghost);
}

.live-dot {
  display: flex; align-items: center; gap: 7px;
  font-family: 'Syne', sans-serif;
  font-size: 8.5px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--ghost);
}
.live-dot::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: var(--bull);
  box-shadow: 0 0 8px var(--bull-glow);
  animation: blink 2.4s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.18; } }

/* ── LOGOUT BUTTON ───────────────────────────────── */
.logout-btn {
  font-family: 'Syne', sans-serif;
  font-size: 7.5px;
  letter-spacing: 0.2em;
  color: var(--ghost);
  background: none;
  border: 1px solid var(--border);
  padding: 5px 13px;
  cursor: pointer;
  transition: color 0.15s, border-color 0.15s;
  outline: none;
  text-transform: lowercase;
}
.logout-btn:hover {
  color: var(--text);
  border-color: var(--border-hi);
}

/* ── TABS ────────────────────────────────────────── */
.tab-bar {
  display: flex;
  padding: 0 32px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
  background: rgba(6,6,8,0.45);
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
  position: sticky;
  top: 51px;
  z-index: 99;
}
.tab-btn {
  font-family: 'Syne', sans-serif;
  font-size: 8.5px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ghost);
  padding: 11px 18px 10px;
  border: none;
  background: none;
  cursor: pointer;
  border-bottom: 1.5px solid transparent;
  margin-bottom: -1px;
  transition: color 0.15s, border-color 0.15s;
  outline: none;
}
.tab-btn:hover { color: var(--muted); }
.tab-btn.active {
  color: var(--text);
  border-bottom-color: rgba(200,208,220,0.55);
}

/* ── TAB PANE ────────────────────────────────────── */
.tab-pane { display: none; }
.tab-pane.active { display: block; }

/* ── MAIN ────────────────────────────────────────── */
main {
  max-width: 1160px; margin: 0 auto;
  padding: 22px 28px 44px;
}

/* ── ANIMATIONS ──────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── SECTION LABEL ───────────────────────────────── */
.sec-lbl {
  font-family: 'Syne', sans-serif;
  font-size: 8px; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--ghost);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 10px;
}
.sec-lbl::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(255,255,255,0.1), transparent);
}

/* ── CARD ────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 18px 20px;
  opacity: 0;
  animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
  position: relative;
  overflow: hidden;
  transition: background 0.22s, border-color 0.22s;
}
.card::after {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 2px;
  background: rgba(255,255,255,0.5);
  opacity: 0;
  transition: opacity 0.22s;
}
.card:hover { background: var(--surface-hi); border-color: var(--border-hi); }
.card:hover::after { opacity: 0.35; }

.card-title {
  font-family: 'Syne', sans-serif;
  font-size: 7.5px; font-weight: 600;
  letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--ghost);
  margin-bottom: 14px; padding-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.055);
}

/* ── GRIDS ───────────────────────────────────────── */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
@media (max-width: 820px) { .g2,.g3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 540px) { .g2,.g3 { grid-template-columns: 1fr; } }

/* ── KV ROW ──────────────────────────────────────── */
.kv {
  display: flex; justify-content: space-between;
  align-items: baseline; gap: 8px; margin-bottom: 6px;
}
.kv:last-child { margin-bottom: 0; }
.kk { font-size: 9.5px; color: var(--ghost); white-space: nowrap; }

/* ── HERO ────────────────────────────────────────── */
#hero {
  padding: 32px 36px; margin-bottom: 10px;
  border: 1px solid var(--border); border-radius: 2px;
  display: flex; align-items: center;
  justify-content: space-between; gap: 20px;
  background: var(--surface);
  opacity: 0;
  animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.03s forwards;
  position: relative; overflow: hidden;
}
#hero::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
}
#hero.bull::before  { background: var(--bull);  box-shadow: 4px 0 20px var(--bull-glow); }
#hero.bear::before  { background: var(--bear);  box-shadow: 4px 0 20px var(--bear-glow); }
#hero.mixed::before { background: var(--mixed); box-shadow: 4px 0 20px var(--mixed-glow); }
#hero::after {
  content: '';
  position: absolute; right: 20px; bottom: 16px;
  width: 16px; height: 16px;
  border-right: 1px solid rgba(255,255,255,0.14);
  border-bottom: 1px solid rgba(255,255,255,0.14);
}
#hero.bull  { border-color: rgba(52,211,153,0.24);  box-shadow: 0 0 60px rgba(52,211,153,0.05); }
#hero.bear  { border-color: rgba(248,113,113,0.24); box-shadow: 0 0 60px rgba(248,113,113,0.05); }
#hero.mixed { border-color: rgba(251,191,36,0.2);   box-shadow: 0 0 60px rgba(251,191,36,0.05); }

.hero-eyebrow {
  font-family: 'Syne', sans-serif;
  font-size: 8px; letter-spacing: 0.3em;
  text-transform: uppercase; color: var(--ghost); margin-bottom: 8px;
}
#hero-label {
  font-family: 'Syne', sans-serif;
  font-size: 54px; font-weight: 800;
  letter-spacing: 0.05em; line-height: 1;
}
#hero.bull  #hero-label { color: var(--bull);  text-shadow: 0 0 55px rgba(52,211,153,0.4); }
#hero.bear  #hero-label { color: var(--bear);  text-shadow: 0 0 55px rgba(248,113,113,0.4); }
#hero.mixed #hero-label { color: var(--mixed); text-shadow: 0 0 55px rgba(251,191,36,0.4); }

#hero-sub { margin-top: 10px; color: var(--muted); font-size: 10.5px; letter-spacing: 0.04em; }

#hero-right { text-align: right; flex-shrink: 0; }
.wlbl {
  font-family: 'Syne', sans-serif;
  font-size: 7.5px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--ghost);
}
.wval { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

/* ── REGIME ──────────────────────────────────────── */
.rname {
  font-family: 'Syne', sans-serif;
  font-size: 19px; font-weight: 700;
  letter-spacing: 0.06em; margin-bottom: 4px;
}
.rname.bull  { color: var(--bull); }
.rname.bear  { color: var(--bear); }
.rname.mixed { color: var(--mixed); }

.rscore {
  font-size: 10px; color: var(--ghost);
  background: rgba(255,255,255,0.045);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 2px; padding: 2px 8px;
  display: inline-block; margin-bottom: 14px;
}

.factor-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  gap: 5px; margin-top: 12px;
}
.fc {
  border-radius: 2px; padding: 5px 8px; font-size: 9.5px;
  display: flex; justify-content: space-between; align-items: center;
  border: 1px solid transparent; transition: box-shadow 0.2s;
}
.fc.pos  { background: var(--bull-dim);  border-color: var(--bull-b);  color: var(--bull); }
.fc.neg  { background: var(--bear-dim);  border-color: var(--bear-b);  color: var(--bear); }
.fc.zero { background: rgba(255,255,255,0.025); border-color: rgba(255,255,255,0.08); color: var(--ghost); }
.fc.pos:hover  { box-shadow: 0 0 14px var(--bull-glow); }
.fc.neg:hover  { box-shadow: 0 0 14px var(--bear-glow); }
.fc .fn { font-size: 8.5px; opacity: 0.72; }
.fc .fv { font-weight: 700; font-size: 11px; }

/* ── DIRECTION ───────────────────────────────────── */
.dirb {
  font-family: 'Syne', sans-serif;
  font-size: 28px; font-weight: 800;
  letter-spacing: 0.06em; margin-bottom: 4px;
}
.dirb.bull { color: var(--bull); text-shadow: 0 0 24px rgba(52,211,153,0.44); }
.dirb.bear { color: var(--bear); text-shadow: 0 0 24px rgba(248,113,113,0.44); }

.pbar-w { height: 3px; background: rgba(255,255,255,0.06); border-radius: 1px; margin: 10px 0; }
.pbar   { height: 3px; border-radius: 1px; }
.pbar.bull { background: linear-gradient(90deg, rgba(52,211,153,.3), var(--bull)); box-shadow: 0 0 7px var(--bull-glow); }
.pbar.bear { background: linear-gradient(90deg, rgba(248,113,113,.3), var(--bear)); box-shadow: 0 0 7px var(--bear-glow); }

/* ── VIX BADGE ───────────────────────────────────── */
.vbadge {
  display: inline-block;
  font-family: 'Syne', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  border-radius: 2px; padding: 3px 12px;
  margin-bottom: 12px; border: 1px solid transparent;
}
.vbadge.back { background: var(--bear-dim); border-color: var(--bear-b); color: var(--bear); box-shadow: 0 0 12px var(--bear-glow); }
.vbadge.cont { background: var(--bull-dim); border-color: var(--bull-b); color: var(--bull); box-shadow: 0 0 12px var(--bull-glow); }

/* ── COT BAR ─────────────────────────────────────── */
.pb-w { height: 4px; background: rgba(255,255,255,0.05); border-radius: 1px; margin: 8px 0; position: relative; }
.pb-f { height: 4px; border-radius: 1px; }
.pb-m { position: absolute; top: -4px; width: 1px; height: 12px; background: rgba(255,255,255,0.22); }

/* ── KEY LEVELS ──────────────────────────────────── */
.lvl-tbl { width: 100%; border-collapse: collapse; }
.lvl-tbl td { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.044); }
.lvl-tbl tr:last-child td { border-bottom: none; }
.ln { font-size: 10px; color: var(--muted); }
.lv { text-align: right; font-size: 13px; color: var(--accent-sub); }
.lv.hi { color: var(--text) !important; font-weight: 500; text-shadow: 0 0 10px rgba(255,255,255,0.22); }

/* ── ACCURACY STRIP ──────────────────────────────── */
.acc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 20px 28px; margin-bottom: 10px;
  display: flex; gap: 0;
  opacity: 0;
  animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
}
.as { flex: 1; padding: 0 24px; }
.as:first-child { padding-left: 0; }
.as:last-child  { padding-right: 0; }
.as + .as { border-left: 1px solid rgba(255,255,255,0.07); }
.al { font-family: 'Syne', sans-serif; font-size: 7.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ghost); }
.av { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; margin: 4px 0 2px; }
.as2 { font-size: 9.5px; color: var(--muted); }

/* ── HISTORY ─────────────────────────────────────── */
table.hist { width: 100%; border-collapse: collapse; font-size: 11px; }
.hist th {
  text-align: left;
  font-family: 'Syne', sans-serif;
  font-size: 7.5px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ghost); padding: 10px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.08); font-weight: 600;
}
.hist td {
  padding: 7px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.035);
  transition: background 0.15s;
}
.hist tr:hover td { background: rgba(255,255,255,0.022); }
.hist tr:last-child td { border-bottom: none; }

/* ── TAGS ────────────────────────────────────────── */
.tag {
  display: inline-block; border-radius: 2px;
  padding: 1px 7px;
  font-family: 'Syne', sans-serif;
  font-size: 8.5px; font-weight: 700;
  letter-spacing: 0.07em;
  border: 1px solid transparent; white-space: nowrap;
}
.tag.bull  { background: var(--bull-dim);  border-color: var(--bull-b);  color: var(--bull); }
.tag.bear  { background: var(--bear-dim);  border-color: var(--bear-b);  color: var(--bear); }
.tag.mixed { background: var(--mixed-dim); border-color: var(--mixed-b); color: var(--mixed); }

/* ── INTERPRETATION BOX ──────────────────────────── */
.interp {
  margin-top: 10px; padding: 8px 10px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 2px;
  font-size: 11px; color: var(--muted);
  font-style: italic;
}
.interp.good {
  background: var(--bull-dim); border-color: var(--bull-b);
  color: var(--bull); font-style: normal;
}
.interp.bad {
  background: var(--bear-dim); border-color: var(--bear-b);
  color: var(--bear); font-style: normal;
}

/* ── FOOTER ──────────────────────────────────────── */
footer {
  position: relative; z-index: 1;
  text-align: center; color: var(--ghost);
  font-size: 9.5px; letter-spacing: 0.08em;
  padding: 26px 24px;
  border-top: 1px solid rgba(255,255,255,0.05); margin-top: 32px;
}
footer .alph { color: rgba(255,255,255,0.55); }

/* ── MISC ────────────────────────────────────────── */
.loading {
  color: var(--ghost); text-align: center; padding: 80px;
  font-family: 'Syne', sans-serif; letter-spacing: 0.26em;
  font-size: 11px; text-transform: uppercase;
}
.err { color: var(--bear); text-align: center; padding: 80px; }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 1px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }

/* ── RTH BIAS / ARCHETYPE PANEL ─────────────────── */
.arch-hero {
  padding: 28px 32px; margin-bottom: 10px;
  border: 1px solid var(--border); border-radius: 2px;
  background: var(--surface);
  opacity: 0;
  animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
  position: relative; overflow: hidden;
}
.arch-hero::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
}
.arch-hero.bull::before  { background: var(--bull);  box-shadow: 4px 0 20px var(--bull-glow); }
.arch-hero.bear::before  { background: var(--bear);  box-shadow: 4px 0 20px var(--bear-glow); }
.arch-hero.mixed::before { background: var(--mixed); box-shadow: 4px 0 20px var(--mixed-glow); }
.arch-hero.ghost::before { background: rgba(255,255,255,0.2); }
.arch-hero.bull  { border-color: rgba(52,211,153,0.24); }
.arch-hero.bear  { border-color: rgba(248,113,113,0.24); }
.arch-hero.mixed { border-color: rgba(251,191,36,0.2); }

.arch-eyebrow {
  font-family: 'Syne', sans-serif;
  font-size: 8px; font-weight: 700;
  letter-spacing: 0.30em; text-transform: uppercase;
  color: var(--ghost); margin-bottom: 8px;
}
.arch-name {
  font-family: 'Syne', sans-serif;
  font-size: 28px; font-weight: 800;
  letter-spacing: 0.03em; line-height: 1.1; margin-bottom: 6px;
}
.arch-name.bull  { color: var(--bull);  text-shadow: 0 0 40px rgba(52,211,153,0.4); }
.arch-name.bear  { color: var(--bear);  text-shadow: 0 0 40px rgba(248,113,113,0.4); }
.arch-name.mixed { color: var(--mixed); text-shadow: 0 0 40px rgba(251,191,36,0.4); }
.arch-name.ghost { color: var(--ghost); }

.arch-short {
  display: inline-block; border-radius: 2px;
  padding: 2px 9px; margin-bottom: 14px;
  font-family: 'Syne', sans-serif;
  font-size: 8px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  border: 1px solid transparent;
}
.arch-short.bull  { background: var(--bull-dim);  border-color: var(--bull-b);  color: var(--bull); }
.arch-short.bear  { background: var(--bear-dim);  border-color: var(--bear-b);  color: var(--bear); }
.arch-short.mixed { background: var(--mixed-dim); border-color: var(--mixed-b); color: var(--mixed); }
.arch-short.ghost { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.1); color: var(--ghost); }

.arch-desc {
  font-size: 11.5px; color: var(--muted); line-height: 1.6;
  margin-bottom: 14px;
}
.arch-action {
  padding: 10px 14px; margin-bottom: 14px;
  border-left: 3px solid var(--accent-sub);
  background: rgba(255,255,255,0.025);
  font-size: 11px; font-weight: 500;
  color: var(--text); line-height: 1.5;
}

// ── HELPERS ───────────────────────────────────────
function cc(v) {
  if (!v) return "mixed";
  const u = String(v).toUpperCase();
  if (u.includes("BULL") || u.includes("RISK-ON")) return "bull";
  if (u.includes("BEAR") || u.includes("RISK-OFF")) return "bear";
  return "mixed";
}
function dc(v) { return String(v).toUpperCase().includes("BULL") ? "bull" : "bear"; }
function sgn(v) { return (v >= 0 ? "+" : "") + v; }
function fc(v)  { return v > 0 ? "pos" : v < 0 ? "neg" : "zero"; }
function pct(v, d) { return (v * 100).toFixed(d === undefined ? 1 : d) + "%"; }
function txt(v) { return document.createTextNode(String(v)); }

// ── DOM HELPERS ───────────────────────────────────
function el(tag, attrs) {
  const e = document.createElement(tag);
  const children = Array.prototype.slice.call(arguments, 2);
  for (const k in (attrs || {})) {
    if (k === "className") e.className = attrs[k];
    else if (k === "style") Object.assign(e.style, attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (let i = 0; i < children.length; i++) {
    const c = children[i];
    if (c == null) continue;
    e.appendChild(typeof c === "string" ? txt(c) : c);
  }
  return e;
}
function kv(key, val, valStyle) {
  const r = el("div", {className:"kv"});
  r.appendChild(el("span", {className:"kk"}, key));
  r.appendChild(el("span", valStyle ? {style:valStyle} : {}, val));
  return r;
}
function tagEl(text, cls) { return el("span", {className:"tag " + cls}, text); }
function barEl(pct_val, cls) {
  const w = el("div", {className:"pbar-w"});
  const f = el("div", {className:"pbar " + cls});
  f.style.width = Math.max(3, Math.min(100, pct_val)) + "%";
  w.appendChild(f);
  return w;
}
function clearEl(node) { while (node.firstChild) node.removeChild(node.firstChild); }

let _ci = 0;
function card(titleText) {
  const children = Array.prototype.slice.call(arguments, 1);
  const c = el("div", {className:"card"});
  c.style.animationDelay = (_ci++ * 0.1) + "s";
  c.appendChild(el("div", {className:"card-title"}, titleText));
  for (let i = 0; i < children.length; i++) {
    if (children[i]) c.appendChild(children[i]);
  }
  return c;
}
function secLbl(text) { return el("div", {className:"sec-lbl"}, text); }

const VALID_TABS = ["bias", "intraday", "levels"];

function switchTab(name) {
  const btns  = document.querySelectorAll(".tab-btn");
  const panes = document.querySelectorAll(".tab-pane");
  btns.forEach(function(b)  { b.classList.toggle("active", b.getAttribute("data-tab") === name); });
  panes.forEach(function(p) { p.classList.toggle("active", p.id === "pane-" + name); });
  window.location.hash = name;
}

function initHashRouting() {
  const hash = window.location.hash.slice(1) || "bias";
  if (VALID_TABS.indexOf(hash) !== -1) {
    switchTab(hash);
  }
}

window.addEventListener("hashchange", function() {
  const hash = window.location.hash.slice(1) || "bias";
  if (VALID_TABS.indexOf(hash) !== -1) {
    switchTab(hash);
    if (hash === "levels" && typeof maybeRefreshLevels === "function") maybeRefreshLevels();
  }
});

// Returning to a backgrounded tab: refresh stale levels so it never shows blank/old data.
document.addEventListener("visibilitychange", function() {
  if (!document.hidden && (window.location.hash.slice(1) || "bias") === "levels"
      && typeof maybeRefreshLevels === "function") {
    maybeRefreshLevels();
  }
});

// ── LEVELS HELPERS ────────────────────────────────
function regimeClass(r) {
  if (!r) return "mixed";
  const u = String(r).toUpperCase();
  if (u.includes("CONTRACTION")) return "bull";
  if (u.includes("EXPANSION"))   return "bear";
  return "mixed";
}

function fmtGex(v) {
  if (v == null || isNaN(v)) return "—";
  const abs = Math.abs(v);
  const s = v < 0 ? "-" : "+";
  if (abs >= 1e9) return s + (abs / 1e9).toFixed(2) + "B";
  if (abs >= 1e6) return s + (abs / 1e6).toFixed(0) + "M";
  if (abs >= 1e3) return s + (abs / 1e3).toFixed(1) + "K";
  return s + abs.toFixed(0);
}

function fmtDist(v) {
  if (v == null || isNaN(v)) return "—";
  return (v > 0 ? "+" : "") + Math.round(v);
}

function typeTagClass(net_gex) {
  if (net_gex > 0) return "bear";
  if (net_gex < 0) return "bull";
  return "mixed";
}

// ── LEVELS SORT STATE ─────────────────────────────
const lvlSort = { col: "hold_prob", dir: "desc" };
let _lvlData      = null;
let _prevLevels   = {};  // strike_futures → level from previous refresh
// Dynamic green threshold: max(55, time_baseline_pct + 5). Updated each load.
let _holdGreenThreshold = 55;

// ── LEVELS ALERT THRESHOLDS ───────────────────────
// APPROACH_THRESHOLD: within this many NQ points → show "approaching" badge.
const APPROACH_THRESHOLD = 40;

// Directional bias panel: nearest CALL WALL above spot (short) + nearest PUT
// WALL below spot (long). Nearest = most actionable. Weak walls (hold_prob < 0.40)
// are excluded; if all candidates are weak, the filter is dropped so the panel
// never goes blank.
const MIN_BIAS_HOLD = 0.40;

function buildBiasLevels(levels, nqPrice) {
  if (!levels || !levels.length || nqPrice == null) return null;
  const usable = levels.filter(function(l) { return l.dist_nq != null && l.hold_prob != null; });
  if (!usable.length) return null;

  function nearest(cands) {
    if (!cands.length) return null;
    const dominant = cands.filter(function(l) { return l.is_dominant; });
    const base     = dominant.length ? dominant : cands;
    const strong   = base.filter(function(l) { return l.hold_prob >= MIN_BIAS_HOLD; });
    const pool     = strong.length ? strong : base;
    return pool.slice().sort(function(a, b) { return Math.abs(a.dist_nq) - Math.abs(b.dist_nq); })[0];
  }

  // Short: nearest CALL WALL (net_gex > 0) above spot
  const shortCands = usable.filter(function(l) { return l.dist_nq > 0 && (l.net_gex || 0) > 0; });
  // Long: nearest PUT WALL (net_gex < 0) below spot
  const longCands  = usable.filter(function(l) { return l.dist_nq < 0 && (l.net_gex || 0) < 0; });

  return { shortLevel: nearest(shortCands), longLevel: nearest(longCands) };
}

function renderBiasLevels(bias, qqqPrice) {
  if (!bias || (!bias.shortLevel && !bias.longLevel)) return null;
  const box = el("div", {className: "lvl-alert"});

  function row(lbl, level, dirAbove) {
    const r = el("div", {className: "lvl-alert-row"});
    r.appendChild(el("div", {className: "lvl-alert-lbl"}, lbl));
    const arrow = dirAbove ? "▲" : "▼";
    const aColor = dirAbove ? "var(--bear)" : "var(--bull)";
    r.appendChild(el("span", {style:{color: aColor, fontWeight:"700"}}, arrow + " "));
    var mainSpan = el("span", {className: "lvl-alert-main"},
      String(level.type || "WALL") + "  @  " +
      (level.strike_etf != null ? "$" + level.strike_etf.toFixed(2) : "—"));
    r.appendChild(mainSpan);
    if (level.conviction === "STANDALONE") {
      r.appendChild(el("span", {className:"conviction-badge conviction-standalone"}, "Standalone"));
    } else if (level.conviction === "CONFIRM") {
      r.appendChild(el("span", {className:"conviction-badge conviction-confirm"}, "Needs Confirm"));
    }
    const distQQQ = (level.strike_etf != null && qqqPrice != null)
      ? Math.abs(level.strike_etf - qqqPrice).toFixed(2)
      : null;
    const holdPct = level.hold_prob != null ? Math.round(level.hold_prob * 100) + "% hold" : "score " + (level.score != null ? level.score.toFixed(0) : "—");
    r.appendChild(el("span", {className: "lvl-alert-meta"},
      (distQQQ != null ? "$" + distQQQ + " " : "") + (dirAbove ? "above" : "below") +
      " · " + holdPct
    ));
    if (Math.abs(level.dist_nq) <= APPROACH_THRESHOLD) {
      r.appendChild(el("span", {className: "lvl-alert-approach"}, "approaching"));
    }
    return r;
  }

  function hint(level) {
    var conds = level && level.hps_conditions;
    var score = level && level.hps_score;
    var label = level && level.hps_label;

    if (!conds) {
      // Fallback for API responses without HPS (shouldn't happen after deploy)
      var conf  = level && level.confluence;
      var hp    = level && level.hold_prob;
      var txt, color;
      if (conf)                     { txt = "Multi-Greek confluence ✓";                     color = "var(--bull)"; }
      else if (hp != null && hp >= 0.55) { txt = "Single-Greek lead — LVN or OTE adds conviction"; color = "var(--muted)"; }
      else                          { txt = "Greeks partial — look for LVN or OTE confirmation"; color = "var(--bear)"; }
      return el("div", {style:{fontSize:"11px",color:color,padding:"0 8px 4px",fontStyle:"italic",opacity:"0.85"}}, txt);
    }

    var condDefs = [
      {key:"regime_positive",   lbl:"Positive Gamma"},
      {key:"gtbr_inside",       lbl:"Within GTBR"},
      {key:"dex_aligned",       lbl:"DEX Counter-Trend"},
      {key:"charm_vanna",       lbl:"Charm / Vanna"},
      {key:"magnitude_outlier", lbl:"GEX Outlier"},
    ];
    var grid = el("div", {className:"hps-grid"});
    condDefs.forEach(function(c) {
      var pass = conds[c.key];
      var item = el("div", {className:"hps-cond " + (pass ? "pass" : "fail")});
      item.appendChild(el("span", {style:{fontSize:"8px"}}, pass ? "●" : "○"));
      item.appendChild(document.createTextNode(" " + c.lbl));
      grid.appendChild(item);
    });
    var scoreColor = score >= 4 ? "var(--bull)" : score === 3 ? "var(--mixed)" : "var(--ghost)";
    var summaryTxt = "HPS " + (score || 0) + "/5 · " + (label || "LOW");
    if (level.delta_gex != null && level.net_gex !== 0) {
      var dgPct  = level.delta_gex / Math.abs(level.net_gex);
      var streak = (level.gex_streak && level.gex_streak.count >= 2)
        ? " (" + level.gex_streak.count + " refreshes)" : "";
      if      (dgPct < -0.08) summaryTxt += "  ·  ⚠ GEX fading" + streak;
      else if (dgPct >  0.08) summaryTxt += "  ·  ↑ GEX building" + streak;
    }
    grid.appendChild(el("div", {className:"hps-summary", style:{color:scoreColor}}, summaryTxt));
    return grid;
  }

  if (bias.shortLevel) {
    box.appendChild(row("Short at", bias.shortLevel, true));
    box.appendChild(hint(bias.shortLevel));
  }
  if (bias.longLevel) {
    box.appendChild(row("Long at", bias.longLevel, false));
    box.appendChild(hint(bias.longLevel));
  }

  return box;
}

// ── BUILD LEVEL ROW ───────────────────────────────
function makeLvlRow(lvl) {
  const tr = el("tr");
  if (lvl._isPrimary)    tr.className = "primary-row";
  if (!lvl.is_dominant)  tr.classList.add("non-dominant");
  const gexColor = lvl.net_gex > 0 ? "var(--bear)" : lvl.net_gex < 0 ? "var(--bull)" : "var(--muted)";
  const vexColor = lvl.net_vex > 0 ? "var(--bear)" : lvl.net_vex < 0 ? "var(--bull)" : "var(--muted)";
  const dexColor = lvl.net_dex > 0 ? "var(--bull)" : lvl.net_dex < 0 ? "var(--bear)" : "var(--muted)";
  const chmColor = lvl.net_charmex > 0 ? "var(--bull)" : lvl.net_charmex < 0 ? "var(--bear)" : "var(--muted)";
  const dist = lvl.dist_nq;
  const distColor = dist > 0 ? "var(--bear)" : dist < 0 ? "var(--bull)" : "var(--muted)";

  tr.appendChild(el("td", {style:{color:"var(--text)",fontWeight:"500"}},
    lvl.strike_etf != null ? lvl.strike_etf.toFixed(2) : "—"));
  tr.appendChild(el("td", {style:{color:distColor}},
    dist != null ? fmtDist(dist) : "—"));

  var holdPct = lvl.hold_prob != null ? Math.round(lvl.hold_prob * 100) : null;
  var holdColor = holdPct == null ? "var(--muted)"
    : holdPct >= _holdGreenThreshold ? "var(--bull)"
    : holdPct >= 40 ? "var(--muted)"
    : "var(--bear)";
  tr.appendChild(el("td", {style:{color:holdColor, fontWeight:"500"}},
    holdPct != null ? holdPct + "%" : "—"));

  // HPS score dots: filled = condition met, open = not met
  var hpsScore = lvl.hps_score;
  var hpsLabel = lvl.hps_label;
  var hpsColor = hpsLabel === "HIGH"   ? "var(--bull)"
               : hpsLabel === "MEDIUM" ? "var(--mixed)"
               : "var(--ghost)";
  var hpsDots = hpsScore != null
    ? Array.from({length: 5}, function(_, i) { return i < hpsScore ? "●" : "○"; }).join("")
    : "—";
  tr.appendChild(el("td", {style:{color:hpsColor, fontFamily:"'JetBrains Mono',monospace", fontSize:"9px", letterSpacing:"1px", fontWeight:"500"}}, hpsDots));

  const ttd = el("td");
  if (lvl._isPrimary) ttd.appendChild(el("span", {className:"primary-badge"}, "PRIMARY"));
  ttd.appendChild(el("span", {className:"type-tag " + typeTagClass(lvl.net_gex)},
    String(lvl.type || "—")));
  tr.appendChild(ttd);

  // GEX with reinforcing/pulling delta arrow + intensification streak
  var gexTd = el("td", {style:{color:gexColor}});
  gexTd.appendChild(document.createTextNode(fmtGex(lvl.net_gex)));
  if (lvl.delta_gex != null && lvl.net_gex !== 0) {
    var dgPct = lvl.delta_gex / Math.abs(lvl.net_gex);
    var dgCls = dgPct >  0.03 ? "delta-up" : dgPct < -0.03 ? "delta-down" : "delta-flat";
    var dgSym = dgPct >  0.03 ? "↑" : dgPct < -0.03 ? "↓" : "·";
    gexTd.appendChild(el("span", {className:dgCls}, dgSym));
    // consecutive refreshes moving the same way → e.g. "↑x3" = building 3 refreshes straight
    if (lvl.gex_streak && lvl.gex_streak.count >= 2) {
      gexTd.appendChild(el("span", {className:"delta-streak " + dgCls}, "x" + lvl.gex_streak.count));
    }
  }
  tr.appendChild(gexTd);

  tr.appendChild(el("td", {style:{color:vexColor}}, fmtGex(lvl.net_vex)));
  tr.appendChild(el("td", {style:{color:dexColor}}, fmtGex(lvl.net_dex)));
  tr.appendChild(el("td", {style:{color:chmColor}}, fmtGex(lvl.net_charmex)));

  // OI with build/drain delta arrow
  var oiTd = el("td", {style:{color:"var(--muted)"}});
  oiTd.appendChild(document.createTextNode(lvl.total_oi != null ? lvl.total_oi.toLocaleString() : "—"));
  if (lvl.delta_oi != null && lvl.total_oi > 0) {
    var doPct = lvl.delta_oi / lvl.total_oi;
    var doCls = doPct >  0.03 ? "delta-up" : doPct < -0.03 ? "delta-down" : "delta-flat";
    var doSym = doPct >  0.03 ? "↑" : doPct < -0.03 ? "↓" : "·";
    oiTd.appendChild(el("span", {className:doCls}, doSym));
  }
  tr.appendChild(oiTd);
  return tr;
}

function makePanelTable(levels) {
  const tbl = el("table", {className:"lvl-tbl2"});
  const thead = el("thead");
  const htr = el("tr");
  LVL_COLS.forEach(function(c) { htr.appendChild(el("th", {}, c.lbl)); });
  thead.appendChild(htr);
  tbl.appendChild(thead);
  const tbody = el("tbody");
  levels.forEach(function(lvl) { tbody.appendChild(makeLvlRow(lvl)); });
  tbl.appendChild(tbody);
  return tbl;
}

function renderAllTable(wrap, levels) {
  clearEl(wrap);
  const sorted = levels.slice().sort(function(a, b) {
    const av = a[lvlSort.col], bv = b[lvlSort.col];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    const cmp = typeof av === "string" ? av.localeCompare(bv) : av - bv;
    return lvlSort.dir === "desc" ? -cmp : cmp;
  });

  const outer = el("div", {className:"card", style:{padding:"0",overflow:"hidden",animationDelay:"0.15s"}});
  const scroll = el("div", {style:{overflowX:"auto"}});
  const tbl = el("table", {className:"lvl-full-tbl"});
  const thead = el("thead");
  const htr = el("tr");

  LVL_COLS.forEach(function(col) {
    const th = el("th", {}, col.lbl);
    if (lvlSort.col === col.key) th.className = "sort-" + lvlSort.dir;
    th.addEventListener("click", function() {
      if (lvlSort.col === col.key) {
        lvlSort.dir = lvlSort.dir === "desc" ? "asc" : "desc";
      } else {
        lvlSort.col = col.key;
        lvlSort.dir = "desc";
      }
      renderAllTable(wrap, _lvlData.levels);
    });
    htr.appendChild(th);
  });

  thead.appendChild(htr);
  tbl.appendChild(thead);
  const tbody = el("tbody");
  sorted.forEach(function(lvl) { tbody.appendChild(makeLvlRow(lvl)); });
  tbl.appendChild(tbody);
  scroll.appendChild(tbl);
  outer.appendChild(scroll);
  wrap.appendChild(outer);
}

// ── RENDER LEVELS ─────────────────────────────────
function renderLevels(d) {
  _lvlData = d;
  if (d.time_baseline != null) {
    _holdGreenThreshold = Math.max(55, Math.round(d.time_baseline * 100) + 5);
  }
  const app = document.getElementById("levels-app");
  clearEl(app);

  const levels = d.levels || [];

  // ── STATS HEADER ──
  const hdr = el("div", {className:"lvls-header"});

  function stat(lbl, valNode) {
    const s = el("div", {className:"lvls-stat"});
    s.appendChild(el("div", {className:"lvls-stat-lbl"}, lbl));
    const v = el("div", {className:"lvls-stat-val"});
    if (typeof valNode === "string") {
      v.textContent = valNode;
    } else {
      v.appendChild(valNode);
    }
    s.appendChild(v);
    return s;
  }

  hdr.appendChild(stat("Updated", d.updated || "—"));
  hdr.appendChild(stat("NQ",
    d.nq_price != null
      ? d.nq_price.toLocaleString("en-US", {minimumFractionDigits:1, maximumFractionDigits:1})
      : "—"));
  hdr.appendChild(stat("QQQ",
    d.qqq_price != null ? d.qqq_price.toFixed(2) : "—"));

  const regBadge = el("span", {className:"lvls-regime " + regimeClass(d.vol_regime)},
    String(d.vol_regime || "—"));
  hdr.appendChild(stat("Regime", regBadge));

  const gfQqq = (d.gamma_flip != null && d.ratio) ? d.gamma_flip / d.ratio : null;
  const gfColor = (gfQqq != null) ? "var(--mixed)" : "var(--ghost)";
  const gfSpan = el("span", {style:{color:gfColor, fontWeight:"700"}},
    gfQqq != null ? gfQqq.toFixed(1) : "—");
  hdr.appendChild(stat("γ Flip", gfSpan));

  hdr.appendChild(stat("IV",
    d.iv != null ? d.iv.toFixed(1) + "%" : "—"));

  if (d.gtbr_pts != null) {
    var gtbrSpan = el("span", {style:{color:"var(--mixed)", fontWeight:"600"}},
      "±" + d.gtbr_pts + " pts");
    hdr.appendChild(stat("GTBR", gtbrSpan));
  }

  const rvColor = (d.rv_iv_ratio != null && d.rv_iv_ratio < 0.8)
    ? "var(--bull)" : "var(--bear)";
  const rvSpan = el("span", {style:{color:rvColor}},
    d.rv_iv_ratio != null ? d.rv_iv_ratio.toFixed(3) : "—");
  hdr.appendChild(stat("RV/IV", rvSpan));

  hdr.appendChild(stat("HV21",
    d.hv21 != null ? d.hv21.toFixed(1) + "%" : "—"));

  app.appendChild(hdr);

  if (d.vol_error) {
    app.appendChild(el("div", {style:{
      fontSize:"9px", color:"var(--bear)", padding:"3px 8px",
      background:"var(--bear-dim)", borderRadius:"3px", marginBottom:"6px",
      letterSpacing:"0.04em",
    }}, "Vol fetch failed: " + d.vol_error));
  }

  // ── HIGH-VOL WARNING BANNER ──
  if (d.vol_regime === "EXPANSION") {
    const warn = el("div", {className: "vol-warn"});
    const icon = el("span", {className: "vol-warn-icon"}, "!");
    const body = el("div", {className: "vol-warn-body"});
    body.appendChild(el("div", {className: "vol-warn-title"}, "HIGH VOL — Wall reliability degraded"));
    body.appendChild(el("div", {className: "vol-warn-sub"},
      "IV expansion detected. Historically 28% hold rate vs 51% in low vol. Treat levels as soft zones, not hard stops."));
    warn.appendChild(icon);
    warn.appendChild(body);
    app.appendChild(warn);
  }

  // ── DTE PICKER ──
  const dtePicker = el("div", {id:"dte-picker", style:{
    display:"flex", alignItems:"center", gap:"6px",
    margin:"10px 0 4px", flexWrap:"wrap"
  }});
  dtePicker.appendChild(el("span", {style:{fontSize:"9px",color:"var(--ghost)",letterSpacing:"0.12em",textTransform:"uppercase",marginRight:"4px"}}, "Expiry"));
  [["Auto", null], ["0DTE", 0], ["1DTE", 1], ["2DTE", 2]].forEach(function(pair) {
    const label = pair[0], dteVal = pair[1];
    const btn = el("button", {
      className: "dte-btn" + (selectedLevelsDTE === dteVal ? " active" : ""),
      "data-dte": String(dteVal),
    }, label);
    btn.addEventListener("click", function() { loadLevels(dteVal); });
    dtePicker.appendChild(btn);
  });
  if (d.expiry_date) {
    const dteLabel = d.expiry_dte > 0 ? "  (" + d.expiry_dte + "DTE  ·  " + d.expiry_date + ")" : "  ·  " + d.expiry_date;
    dtePicker.appendChild(el("span", {style:{fontSize:"9px",color:"var(--ghost)",marginLeft:"6px"}}, dteLabel));
  }
  app.appendChild(dtePicker);

  const refreshBar = el("div", {className:"lvl-refresh-status"});
  refreshBar.appendChild(el("div", {id:"levels-last-updated", className:"refresh-label"}, "Loading…"));
  if (d._baselineLabel) {
    refreshBar.appendChild(el("div", {className:"refresh-label", style:{color:"var(--ghost)"}},
      "·  Δ vs " + d._baselineLabel + " (↑ building / ↓ fading)"));
  }
  refreshBar.appendChild(el("div", {id:"levels-refresh-countdown", className:"refresh-countdown"}, ""));
  app.appendChild(refreshBar);

  const alertNode = renderBiasLevels(buildBiasLevels(levels, d.nq_price), d.qqq_price);
  if (alertNode) app.appendChild(alertNode);

  // ── SUPPORT / RESISTANCE PANELS ──
  const support    = levels.filter(function(l) { return l.net_gex <= 0; })
                           .sort(function(a, b) { return (b.hold_prob || 0) - (a.hold_prob || 0); });
  const resistance = levels.filter(function(l) { return l.net_gex > 0; })
                           .sort(function(a, b) { return (b.hold_prob || 0) - (a.hold_prob || 0); });

  // Mark primary wall on each side (highest |net_gex| = most dealer hedging obligation)
  var primaryCall = null, primaryPut = null;
  levels.forEach(function(l) { l._isPrimary = false; });
  levels.forEach(function(l) {
    if (l.net_gex > 0 && (!primaryCall || Math.abs(l.net_gex) > Math.abs(primaryCall.net_gex)))
      primaryCall = l;
    if (l.net_gex <= 0 && (!primaryPut || Math.abs(l.net_gex) > Math.abs(primaryPut.net_gex)))
      primaryPut = l;
  });
  if (primaryCall) primaryCall._isPrimary = true;
  if (primaryPut)  primaryPut._isPrimary  = true;

  // Compression zone — range between primary call and put walls
  if (primaryCall && primaryPut) {
    var rangeNq = Math.round(Math.abs(primaryCall.strike_futures - primaryPut.strike_futures));
    var czEl = el("div", {className:"compression-zone"});
    czEl.appendChild(el("span", {className:"cz-label"}, "Range"));
    czEl.appendChild(el("span", {className:"cz-put"},
      "PUT " + primaryPut.strike_etf.toFixed(2)));
    czEl.appendChild(el("span", {className:"cz-arrow"}, "↔"));
    czEl.appendChild(el("span", {className:"cz-call"},
      "CALL " + primaryCall.strike_etf.toFixed(2)));
    czEl.appendChild(el("span", {className:"cz-range"}, "· " + rangeNq + " NQ pts"));
    app.appendChild(czEl);
  }

  app.appendChild(secLbl("Gamma Panels"));
  const panels = el("div", {style:{display:"flex",flexDirection:"column",gap:"10px"}});

  function panelCard(titleColor, titleText, rows) {
    const c = el("div", {className:"card", style:{padding:"0",overflow:"hidden",animationDelay:"0.05s"}});
    const t = el("div", {className:"lvl-panel-title"});
    t.appendChild(el("span", {style:{color:titleColor}},
      titleColor === "var(--bull)" ? "▲ " : "▼ "));
    t.appendChild(document.createTextNode(titleText));
    c.appendChild(t);
    if (rows.length === 0) {
      c.appendChild(el("div", {className:"lvl-empty"}, "No levels"));
    } else {
      const scroll = el("div", {style:{overflowX:"auto"}});
      scroll.appendChild(makePanelTable(rows));
      c.appendChild(scroll);
    }
    return c;
  }

  panels.appendChild(panelCard("var(--bear)", "Resistance · Call Walls", resistance));
  panels.appendChild(panelCard("var(--bull)", "Support · Put Walls",      support));
  app.appendChild(panels);

  // ── ALL LEVELS TABLE ──
  const allLbl = secLbl("All Levels");
  allLbl.style.marginTop = "18px";
  app.appendChild(allLbl);
  const allWrap = el("div");
  app.appendChild(allWrap);
  renderAllTable(allWrap, levels);
}

// ── MACRO BIAS TIMER ──────────────────────────────
let macroBiasTimer = null;

function startMacroBiasTimer() {
  const update = function() {
    const e = document.getElementById("macro-next-update");
    if (e) e.textContent = "Next update (Fri 5PM ET): " + formatDurationLong(msUntilNextMacroUpdate());
  };

// ── LOAD LEVELS ───────────────────────────────────
let levelsLoaded         = false;
let levelsRefreshTimeout = null;
let levelsCountdownTimer = null;
let lastLevelsUpdate     = null;
let selectedLevelsDTE    = null; // null = auto
let _levelsReqId         = 0;    // monotonic guard — only the latest request renders
let _levelsAbort         = null; // AbortController of the in-flight request (cancel on supersede)
let _prevLevelsDTE       = null; // which expiry _prevLevels belongs to (avoids cross-expiry deltas)
let _gexStreak           = {};   // strike_futures → {dir,count}: consecutive-refresh GEX trend
let _baselineTime        = null; // timestamp of the snapshot _prevLevels was captured from

// Immediately reflect the pending expiry selection on the picker buttons
// (the picker is otherwise only rebuilt when a fetch resolves, which feels frozen).
// isLoading=false clears the progress state without rebuilding the picker.
function markDtePending(isLoading) {
  const picker = document.getElementById("dte-picker");
  if (!picker) return;
  picker.querySelectorAll(".dte-btn").forEach(function(b) {
    const raw = b.getAttribute("data-dte");
    const val = raw === "null" ? null : parseInt(raw, 10);
    const isSel = val === selectedLevelsDTE;
    b.classList.toggle("active", isSel);
    b.classList.toggle("loading", isSel && isLoading !== false);
  });
}

// Transient error banner that does NOT wipe existing data. Auto-clears, and is
// removed on the next successful render (renderLevels rebuilds levels-app).
function showLevelsError(msg) {
  const app = document.getElementById("levels-app");
  if (!app) return;
  const old = document.getElementById("levels-err-banner");
  if (old) old.remove();
  const banner = el("div", {id:"levels-err-banner", style:{
    fontSize:"10px", color:"var(--bear)", padding:"6px 10px", margin:"6px 0",
    background:"var(--bear-dim)", border:"1px solid var(--bear-b)", borderRadius:"4px",
    letterSpacing:"0.03em",
  }}, "⚠ " + msg);
  app.insertBefore(banner, app.firstChild);
  setTimeout(function() {
    const b = document.getElementById("levels-err-banner");
    if (b) b.remove();
  }, 8000);
}

// Refresh levels when returning to the tab if data is missing/stale, so a
// transient error that happened while away self-heals on return.
function maybeRefreshLevels() {
  const stale = !lastLevelsUpdate || (Date.now() - lastLevelsUpdate.getTime() > 20000);
  if (stale) loadLevels();
}

function formatTimeET(date) {
  return date.toLocaleString('en-US', {
    hour: 'numeric', minute: '2-digit', timeZone: 'America/New_York'
  }) + ' ET';
}

function formatDuration(ms) {
  if (ms <= 0) return "00:00";
  const s    = Math.floor(ms / 1000);
  const mins = Math.floor(s / 60);
  const secs = s % 60;
  return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
}

function formatDurationLong(ms) {
  if (ms <= 0) return "updating…";
  const s    = Math.floor(ms / 1000);
  const days = Math.floor(s / 86400);
  const hrs  = Math.floor((s % 86400) / 3600);
  const mins = Math.floor((s % 3600) / 60);
  if (days > 0) return days + "d " + hrs + "h " + mins + "m";
  if (hrs  > 0) return hrs  + "h " + mins + "m";
  return mins + "m";
}

function getETOffset() {
  const now   = new Date();
  const nyMs  = +new Date(now.toLocaleString('en-US', {timeZone: 'America/New_York'}));
  const utcMs = +new Date(now.toLocaleString('en-US', {timeZone: 'UTC'}));
  return (nyMs - utcMs) / 3600000;
}

// Macro data refreshes every Friday 5:00 PM ET (after CFTC COT release).
function msUntilNextMacroUpdate() {
  const now      = new Date();
  const etOffset = getETOffset();
  const etMs     = now.getTime() + etOffset * 3600000;
  const etDate   = new Date(etMs);
  const dayET    = etDate.getUTCDay();
  const hourET   = etDate.getUTCHours();
  let daysUntil  = (5 - dayET + 7) % 7;
  if (daysUntil === 0 && hourET >= 17) daysUntil = 7;
  const targetEtDate = new Date(etMs + daysUntil * 86400000);
  targetEtDate.setUTCHours(17, 0, 0, 0);
  return targetEtDate.getTime() - etOffset * 3600000 - now.getTime();
}

function getNextLevelsRefreshMark() {
  const now  = new Date();
  const next = new Date(now);
  const m    = next.getMinutes();
  const nm   = Math.ceil((m * 60 + next.getSeconds() + 1) / 60) * 60;
  next.setMinutes(0, nm, 0);
  return next;
}

function updateLevelsStatus() {
  const countdownEl = document.getElementById("levels-refresh-countdown");
  const updatedEl   = document.getElementById("levels-last-updated");
  if (!countdownEl) return;

  const remaining = getNextLevelsRefreshMark() - Date.now();
  countdownEl.textContent = "Next refresh in " + formatDuration(remaining);
  countdownEl.style.color = "var(--text)";

  if (updatedEl && lastLevelsUpdate) {
    updatedEl.textContent = "Last updated " + formatTimeET(lastLevelsUpdate);
  }
}

function scheduleNextRefresh() {
  if (levelsRefreshTimeout) clearTimeout(levelsRefreshTimeout);
  const ms = getNextLevelsRefreshMark() - Date.now();
  levelsRefreshTimeout = setTimeout(function() {
    loadLevels();
    scheduleNextRefresh();
  }, ms);
}

function startCountdownTimer() {
  if (levelsCountdownTimer) clearInterval(levelsCountdownTimer);
  levelsCountdownTimer = setInterval(updateLevelsStatus, 1000);
  updateLevelsStatus();
}

function loadLevels(dte) {
  // Only wipe the delta baseline when the expiry actually changes — a manual
  // re-click or auto-refresh on the same expiry keeps its intensification history.
  const prevSelected = selectedLevelsDTE;
  const isSwitch     = (dte !== undefined && dte !== selectedLevelsDTE);
  if (dte !== undefined) selectedLevelsDTE = dte;
  if (isSwitch) {
    _prevLevels = {}; _gexStreak = {}; _prevLevelsDTE = null; _baselineTime = null;
  }
  const reqId = ++_levelsReqId;   // claim latest; out-of-order/stale responses are discarded
  markDtePending();               // instant visual feedback on the clicked button

  // Cancel any still-in-flight request so it frees its connection slot immediately.
  // Without this, fast clicking saturates the browser's ~6-connection-per-host pool
  // and the newest request queues behind stale ones — the "takes ages / stops working" bug.
  if (_levelsAbort) _levelsAbort.abort();
  const ctrl = new AbortController();
  _levelsAbort = ctrl;
  // Browser fetch has no default timeout — abort after 20s so a hung request
  // can't leave the picker stuck on "loading".
  const killer = setTimeout(function() { ctrl.abort(); }, 20000);

  // On any failure: never blank a tab that already has good data, and never
  // strand the picker on an expiry we couldn't actually load.
  function onFailure(msg) {
    if (reqId !== _levelsReqId) return;  // superseded (or aborted) — newer request owns the UI
    if (isSwitch && levelsLoaded) {
      selectedLevelsDTE = prevSelected;  // revert — the data on screen is still prevSelected's
      markDtePending(false);
      showLevelsError(msg || "Could not load that expiry.");
    } else if (!levelsLoaded) {
      const app = document.getElementById("levels-app");
      if (app) { clearEl(app); app.appendChild(el("div", {className:"lvl-await"}, "Awaiting data…")); }
    } else {
      markDtePending(false);  // transient auto-refresh error — keep last good render
      showLevelsError(msg || "Refresh failed — showing last update.");
    }
  }

  const dteParam = selectedLevelsDTE != null ? "&dte=" + selectedLevelsDTE : "";
  fetch("/.netlify/functions/levels?_=" + Date.now() + dteParam, {
    method: "GET",
    signal: ctrl.signal,
    headers: {
      "Authorization": "Bearer " + localStorage.getItem("vanta_session")
    }
  })
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(d) {
      clearTimeout(killer);
      if (reqId !== _levelsReqId) return;  // a newer click/refresh superseded this response
      // levels.js returns {error:true} with HTTP 200 when the upstream fetch fails —
      // treat it as a failure, not as empty data, so we don't blank the tab.
      if (!d || d.error || !Array.isArray(d.levels)) { onFailure(d && d.message); return; }
      attachDeltas(d);
      levelsLoaded     = true;
      lastLevelsUpdate = new Date();
      renderLevels(d);  // rebuilds the picker fresh, clearing the loading state
    })
    .catch(function(e) {
      clearTimeout(killer);
      onFailure(e && e.message);
    });
}

// Diff each strike against the previous snapshot of the SAME expiry and attach:
//   delta_gex / delta_oi   — single-refresh change
//   gex_streak {dir,count} — consecutive refreshes moving the same way (intensifying/fading)
// Then re-baseline for the next diff.
function attachDeltas(d) {
  const curDTE = d.expiry_dte;
  if (_prevLevelsDTE !== curDTE) { _prevLevels = {}; _gexStreak = {}; }  // expiry changed under us

  const haveBaseline = Object.keys(_prevLevels).length > 0;
  if (d.levels && haveBaseline) {
    d.levels.forEach(function(lvl) {
      const prev = _prevLevels[lvl.strike_futures];
      if (!prev) return;
      lvl.delta_gex = lvl.net_gex  - prev.net_gex;
      lvl.delta_oi  = lvl.total_oi - prev.total_oi;
      const pct = prev.net_gex !== 0 ? lvl.delta_gex / Math.abs(prev.net_gex) : 0;
      const dir = pct > 0.03 ? 1 : pct < -0.03 ? -1 : 0;
      const s   = _gexStreak[lvl.strike_futures];
      _gexStreak[lvl.strike_futures] = (dir !== 0 && s && s.dir === dir)
        ? { dir: dir, count: s.count + 1 }
        : { dir: dir, count: dir !== 0 ? 1 : 0 };
      lvl.gex_streak = _gexStreak[lvl.strike_futures];
    });
    d._baselineLabel = _baselineTime ? formatTimeET(_baselineTime) : null;
  }

  // Re-baseline for next diff (keyed by strike_futures, tagged with this expiry)
  _prevLevels = {};
  (d.levels || []).forEach(function(lvl) { _prevLevels[lvl.strike_futures] = lvl; });
  _prevLevelsDTE = curDTE;
  _baselineTime  = new Date();
}

// ── RTH / INTRADAY HELPERS ────────────────────────
const ARCH_SIGNAL_LABELS = {
  near_flip:      'Near gamma flip',
  dex_positive:   'DEX positive',
  dex_negative:   'DEX negative',
  call_bias:      'Call-side flow',
  put_bias:       'Put-side flow',
  put_wall_near:  'Put wall proximal',
  call_wall_near: 'Call wall overhead',
  charm_positive: 'Charm positive',
  charm_negative: 'Charm negative',
  above_flip:     'Above flip',
  well_above_flip:'Well above flip',
  extended_above: 'Extended above',
  well_below_flip:'Well below flip',
  extended_below: 'Extended below',
  room_to_run:    'No cap overhead',
  room_to_fall:   'No floor below',
  call_buying:    'Broad call buying',
  put_buying:     'Broad put buying',
};
function archSignalLabel(key) { return ARCH_SIGNAL_LABELS[key] || key; }

function intradayBiasClass(bias) {
  if (!bias) return "mixed";
  const u = bias.toUpperCase();
  if (u.includes("BULL")) return "bull";
  if (u.includes("BEAR") || u.includes("CONTINUATION")) return "bear";
  return "mixed";
}
function confidenceClass(conf) {
  if (!conf) return "ghost";
  const u = conf.toUpperCase();
  if (u === "HIGH")     return "bull";
  if (u === "MODERATE") return "mixed";
  return "bear";
}
function entropyClass(s) {
  if (s === "STABLE")   return "bull";
  if (s === "CRITICAL") return "bear";
  return "ghost";
}
function gammaRegClass(r) {
  if (r === "POSITIVE")  return "bull";
  if (r === "NEGATIVE")  return "bear";
  if (r === "NEAR_FLIP") return "mixed";
  return "ghost";
}

// ── RENDER RTH BIAS ────────────────────────────────
function renderIntraday(d) {
  const app = document.getElementById("intraday-app");
  clearEl(app);

  // ── REFRESH STATUS BAR ──────────────────────────
  const iRefreshBar = el("div", {className:"lvl-refresh-status"});
  iRefreshBar.appendChild(el("div", {id:"intraday-last-updated", className:"refresh-label"}, "Loading…"));
  iRefreshBar.appendChild(el("div", {id:"intraday-refresh-countdown", className:"refresh-countdown"}, ""));
  app.appendChild(iRefreshBar);

  // ── BIG OPEN ARCHETYPE PANEL ────────────────────
  app.appendChild(secLbl("Today's Predicted Open"));
  const arch      = d.open_archetype;
  const archDir   = d.open_archetype_dir || "ghost";
  const archName  = d.open_archetype_name || (arch || "No Signal");
  const archShort = d.open_archetype_short || arch || "—";
  const archConf  = d.open_archetype_confidence || 0;
  const archDesc  = d.open_archetype_desc || "";
  const archAct   = d.open_archetype_action || "";
  const archSigs  = d.open_archetype_signals || [];

  const archHero = el("div", {className:"arch-hero " + archDir});
  archHero.appendChild(el("div", {className:"arch-eyebrow"}, "Open Archetype · NQ Futures"));
  archHero.appendChild(el("div", {className:"arch-name " + archDir}, archName));
  if (archShort && archShort !== archName) {
    archHero.appendChild(el("div", {className:"arch-short " + archDir}, archShort));
  }

  if (archDesc) {
    archHero.appendChild(el("div", {className:"arch-desc"}, archDesc));
  }

  if (archAct) {
    const actBox = el("div", {className:"arch-action " + archDir});
    actBox.appendChild(el("strong", {}, "ACTION: "));
    actBox.appendChild(document.createTextNode(archAct));
    archHero.appendChild(actBox);
  }

  if (archSigs.length) {
    const sigsRow = el("div", {className:"arch-signals"});
    archSigs.forEach(function(s) {
      sigsRow.appendChild(el("span", {className:"arch-chip"}, archSignalLabel(s)));
    });
    archHero.appendChild(sigsRow);
  }

  // Confidence bar (max 5)
  const confRow = el("div", {className:"arch-conf-row"});
  confRow.appendChild(el("span", {className:"arch-conf-label"}, "Signal strength"));
  const confBar = el("div", {className:"arch-conf-bar"});
  const confFill = el("div", {className:"arch-conf-fill " + archDir});
  confFill.style.width = Math.round(Math.min(100, archConf / 5 * 100)) + "%";
  confBar.appendChild(confFill);
  confRow.appendChild(confBar);
  confRow.appendChild(el("span", {className:"arch-conf-score"}, archConf + " / 5"));
  archHero.appendChild(confRow);

  // Key levels row
  const levRow = el("div", {className:"arch-levels-row"});
  if (d.gamma_flip != null) {
    const li1 = el("div", {className:"arch-level-item"});
    li1.appendChild(el("div", {className:"arch-level-lbl"}, "γ Flip (QQQ)"));
    const gfQqq2 = (d.nq_price && d.qqq_price) ? d.gamma_flip * d.qqq_price / d.nq_price : null;
    li1.appendChild(el("div", {className:"arch-level-val", style:{color:"var(--flip)"}},
      gfQqq2 != null ? gfQqq2.toFixed(1) : d.gamma_flip.toFixed(1)));
    levRow.appendChild(li1);
  }
  if (d.nq_price != null) {
    const li2 = el("div", {className:"arch-level-item"});
    li2.appendChild(el("div", {className:"arch-level-lbl"}, "NQ Price"));
    li2.appendChild(el("div", {className:"arch-level-val"},
      d.nq_price.toLocaleString("en-US", {minimumFractionDigits:1, maximumFractionDigits:1})));
    levRow.appendChild(li2);
  }
  const tw = d.top_wall;
  if (tw && tw.strike_futures != null) {
    const isBull = (tw.net_gex || 0) < 0;
    const li3 = el("div", {className:"arch-level-item"});
    li3.appendChild(el("div", {className:"arch-level-lbl"}, isBull ? "Top Put Wall" : "Top Call Wall"));
    li3.appendChild(el("div", {className:"arch-level-val",
      style:{color: isBull ? "var(--bull)" : "var(--bear)"}},
      tw.strike_futures.toFixed(1)));
    levRow.appendChild(li3);
  }
  if (levRow.childNodes.length) archHero.appendChild(levRow);

  // Runner-up — show descriptive names instead of TYPE codes
  if (d.open_archetype_runner_up) {
    const ARCH_NAMES = {
      TYPE_A: 'Down Sweep', TYPE_B: 'Up Sweep',
      TYPE_C: 'Straight Bull', TYPE_D: 'Straight Bear',
    };
    const ruRow = el("div", {className:"arch-runner-up"});
    ruRow.appendChild(el("span", {className:"arch-ru-label"}, "Other signals:"));
    const allScores = d.open_archetype_all_scores || {};
    Object.keys(allScores).forEach(function(t) {
      if (t === arch || !allScores[t]) return;
      const label = (ARCH_NAMES[t] || t) + "  " + allScores[t] + "/5";
      ruRow.appendChild(el("span", {className:"arch-ru-item"}, label));
    });
    archHero.appendChild(ruRow);
  }

  // Updated timestamp — appended inside hero (was missing the appendChild call)
  const updRow = el("div", {style:{marginTop:"14px",paddingTop:"10px",
    borderTop:"1px solid rgba(255,255,255,0.06)",
    display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"10px"}});
  updRow.appendChild(el("div", {style:{fontSize:"9px",color:"var(--ghost)"}},
    "Updated " + (d.updated || "—") + "  ·  " + (d.pred_date || "") + (d.expiry_dte > 0 ? "  (" + d.expiry_dte + "DTE)" : "")));
  archHero.appendChild(updRow);
  app.appendChild(archHero);

  // ── RTH MACRO BIAS ──────────────────────────────
  app.appendChild(secLbl("RTH Macro Backdrop"));
  const rthHero = el("div", {className:"rth-hero"});

  const rthVerdict = d.rth_bias || "UNKNOWN";
  const rthCls     = d.rth_bias_cls || "ghost";
  const rthLabel   = d.rth_bias_label || rthVerdict;
  const rthSummary = d.rth_bias_summary || "";

  const verdictBlock = el("div", {className:"rth-verdict-block"});
  verdictBlock.appendChild(el("div", {className:"arch-eyebrow"}, "RTH Bias"));
  verdictBlock.appendChild(el("div", {className:"rth-verdict " + rthCls}, rthLabel));
  const bCount = d.rth_bull_count || 0, beCount = d.rth_bear_count || 0;
  verdictBlock.appendChild(el("div", {className:"rth-score-row"},
    "Bull signals: " + bCount + "  ·  Bear signals: " + beCount));
  rthHero.appendChild(verdictBlock);

  // Factors table
  const factorsDiv = el("div", {className:"rth-factors"});
  const rf = d.rth_factors || {};
  const factorRows = [
    { name: "2Y Yield",    key: "yield" },
    { name: "Liquidity",   key: "liquidity" },
    { name: "COT Crowd",   key: "cot" },
    { name: "BOJ / Carry", key: "boj" },
  ];
  factorRows.forEach(function(fr) {
    const f = rf[fr.key] || {};
    const row = el("div", {className:"rth-factor-row"});
    row.appendChild(el("span", {className:"rth-factor-name"}, fr.name));
    const valSpan = el("span", {className:"rth-factor-val " + (f.cls || "ghost")},
      f.label || f.signal || "—");
    if (fr.key === "cot" && f.pctile != null) {
      valSpan.textContent += "  (" + f.pctile + "th)";
    }
    if (fr.key === "boj" && f.usdjpy != null) {
      valSpan.textContent += "  USDJPY " + f.usdjpy;
    }
    row.appendChild(valSpan);
    if (f.interp) {
      row.appendChild(el("span", {className:"rth-factor-interp"}, f.interp));
    }
    factorsDiv.appendChild(row);
  });

  if (rthSummary) {
    factorsDiv.appendChild(el("div", {className:"rth-summary"}, rthSummary));
  }
  rthHero.appendChild(factorsDiv);
  app.appendChild(rthHero);

  // AIR POCKET WATCH banner (if active)
  if (d.air_pocket_watch) {
    const banner = el("div", {className:"air-pocket-banner"});
    banner.appendChild(el("div", {className:"apw-icon"}, "⚡"));
    const bText = el("div", {style:{flex:"1"}});
    bText.appendChild(el("div", {className:"apw-title"},
      "AIR POCKET WATCH" + (d.air_pocket_type ? "  ·  " + d.air_pocket_type : "")));
    if (d.reason) bText.appendChild(el("div", {className:"apw-desc"}, d.reason));
    banner.appendChild(bText);
    app.appendChild(banner);
  }

  // ── OPTIONS CONTEXT (secondary) ────────────────
  app.appendChild(secLbl("Options Structure"));

  // GEX + Gamma Regime row
  const row1 = el("div", {className:"g3"});

  const gamCard = card("Gamma Regime");
  const gamReg = d.gamma_regime || "UNKNOWN";
  gamCard.appendChild(el("div", {className:"iday-state-badge " + gammaRegClass(gamReg)}, gamReg));
  gamCard.appendChild(kv("NQ Price", d.nq_price != null ?
    d.nq_price.toLocaleString("en-US", {minimumFractionDigits:1, maximumFractionDigits:1}) : "—"));
  gamCard.appendChild(kv("γ Flip (NQ)", d.gamma_flip != null ?
    d.gamma_flip.toLocaleString("en-US", {minimumFractionDigits:1, maximumFractionDigits:1}) : "—"));
  if (d.nq_price != null && d.gamma_flip != null) {
    const diff = d.nq_price - d.gamma_flip;
    gamCard.appendChild(kv("vs Flip",
      (diff >= 0 ? "+" : "") + diff.toFixed(1) + " pts",
      {color: diff >= 0 ? "var(--bull)" : "var(--bear)"}));
  }
  row1.appendChild(gamCard);

  const entCard = card("Return Entropy Gate");
  const entState = d.entropy_state || "UNKNOWN";
  entCard.appendChild(el("div", {className:"iday-state-badge " + entropyClass(entState)}, entState));
  entCard.appendChild(kv("H returns (20d)", d.H_returns != null ? d.H_returns.toFixed(3) : "—"));
  entCard.appendChild(kv("Critical threshold", d.H_threshold != null ? d.H_threshold.toFixed(3) : "—"));
  if (d.H_returns != null && d.H_threshold != null) {
    const maxH = (Math.max(d.H_returns, d.H_threshold) * 1.18) || 1;
    const eBar = el("div", {className:"pb-w"});
    const eFill = el("div", {className:"pb-f"});
    eFill.style.width = Math.min(100, d.H_returns / maxH * 100) + "%";
    eFill.style.background = entState === "CRITICAL" ? "var(--bear)" : "var(--bull)";
    const eMark = el("div", {className:"pb-m"});
    eMark.style.left = Math.min(100, d.H_threshold / maxH * 100) + "%";
    eBar.appendChild(eFill); eBar.appendChild(eMark);
    entCard.appendChild(eBar);
    entCard.appendChild(el("div", {style:{fontSize:"8px",color:"var(--ghost)",marginBottom:"4px"}},
      "fill = current entropy · marker = 75th-pctile threshold"));
  }
  if (entState === "CRITICAL") {
    entCard.appendChild(el("div", {className:"interp bad"},
      "Disordered tape — entropy above 75th-pctile. Options walls carry no directional edge."));
  } else if (entState === "STABLE") {
    entCard.appendChild(el("div", {className:"interp good"},
      "Orderly tape — walls are likely to hold; fading extremes carries edge."));
  } else {
    entCard.appendChild(el("div", {className:"interp"}, "Entropy gate unavailable."));
  }
  if (d.price_source) {
    entCard.appendChild(kv("Source", d.price_source + " daily", {color:"var(--ghost)",fontSize:"9px"}));
  }
  row1.appendChild(entCard);

  const gexCard = card("GEX Dispersion");
  const hgex = d.H_GEX_norm != null ? d.H_GEX_norm : 0.5;
  const hgexColor = hgex > 0.6 ? "var(--mixed)" : hgex < 0.3 ? "var(--bull)" : "var(--muted)";
  gexCard.appendChild(el("div", {className:"dirb", style:{color:hgexColor, fontSize:"28px"}},
    hgex.toFixed(3)));
  gexCard.appendChild(el("div", {style:{color:"var(--ghost)",fontSize:"10px",marginBottom:"8px"}},
    "H_GEX_norm · 0=concentrated, 1=dispersed"));
  const hbarW = el("div", {className:"pbar-w"});
  const hfill = el("div", {className:"pbar"});
  hfill.style.width = (hgex * 100) + "%";
  hfill.style.background = hgex > 0.6 ? "var(--mixed)" : "var(--bull)";
  hbarW.appendChild(hfill);
  gexCard.appendChild(hbarW);
  if (hgex > 0.6) {
    gexCard.appendChild(el("div", {className:"interp", style:{marginTop:"8px"}},
      "Dispersed GEX: no dominant wall, confidence penalized."));
  } else {
    gexCard.appendChild(kv("Wall concentration", hgex < 0.3 ? "High" : "Moderate"));
  }
  row1.appendChild(gexCard);
  app.appendChild(row1);

  // PCA + Top Wall
  const row2 = el("div", {className:"g2"});

  const pcaCard = card("PCA Price Structure");
  const pcaExp = d.pca_explained || [];
  let anyPC = false;
  [
    {key:"PC1 · trend / momentum", val:d.PC1, ex:pcaExp[0]},
    {key:"PC2 · curvature",        val:d.PC2, ex:pcaExp[1]},
    {key:"PC3 · vol regime",       val:d.PC3, ex:pcaExp[2]},
  ].forEach(function(p) {
    if (p.val == null) return;
    anyPC = true;
    const lbl = p.key + (p.ex != null ? "  (" + p.ex + "% var)" : "");
    pcaCard.appendChild(kv(lbl,
      (p.val > 0 ? "+" : "") + p.val.toFixed(3),
      {color: p.val > 0 ? "var(--bull)" : "var(--bear)", fontWeight:"500"}));
    const pw = el("div", {className:"pbar-w", style:{marginBottom:"8px"}});
    const pf = el("div", {className:"pbar " + (p.val > 0 ? "bull" : "bear")});
    pf.style.width = Math.min(100, Math.abs(p.val) * 25) + "%";
    pw.appendChild(pf); pcaCard.appendChild(pw);
  });
  if (!anyPC) {
    pcaCard.appendChild(el("div", {className:"interp"}, "PCA unavailable — price feed unreachable."));
  } else {
    const pc1 = d.PC1 || 0;
    const ext = Math.abs(pc1);
    let pcaMsg, pcaCls;
    if (ext > 2.0) {
      pcaMsg = (pc1 > 0 ? "Strongly extended upward" : "Strongly extended downward")
        + " — levels prone to break.";
      pcaCls = "interp bad";
    } else if (ext > 0.9) {
      pcaMsg = (pc1 > 0 ? "Moderate upward" : "Moderate downward")
        + " — directional with levels skewed.";
      pcaCls = "interp";
    } else {
      pcaMsg = "Balanced / consolidating — levels more likely to hold.";
      pcaCls = "interp good";
    }
    pcaCard.appendChild(el("div", {className:pcaCls}, pcaMsg));
    if (d.pca_n_samples) {
      pcaCard.appendChild(kv("Fit window", d.pca_n_samples + " daily bars",
        {color:"var(--ghost)", fontSize:"9px"}));
    }
  }
  row2.appendChild(pcaCard);

  const twCard = card("Top Wall");
  if (tw) {
    const isBull = (tw.net_gex || 0) < 0;
    const wallColor = isBull ? "var(--bull)" : "var(--bear)";
    twCard.appendChild(el("div", {className:"dirb", style:{color:wallColor, fontSize:"22px"}},
      tw.strike_futures != null ? tw.strike_futures.toFixed(1) : "—"));
    const twTypeWrap = el("div", {style:{marginBottom:"8px"}});
    twTypeWrap.appendChild(el("span", {className:"type-tag " + (isBull ? "bull" : "bear")},
      tw.type || ""));
    twCard.appendChild(twTypeWrap);
    twCard.appendChild(kv("Score", tw.score != null ? tw.score.toFixed(1) : "—"));
    twCard.appendChild(kv("Distance", tw.dist_nq != null ? fmtDist(tw.dist_nq) + " pts" : "—"));
    twCard.appendChild(kv("Proximity score", tw.proximity_score != null ? tw.proximity_score.toFixed(2) : "—"));
    twCard.appendChild(kv("Net GEX", fmtGex(tw.net_gex)));
    twCard.appendChild(kv("Net Vanna", fmtGex(tw.net_vex)));
  } else {
    twCard.appendChild(el("div", {className:"lvl-empty"}, "No wall data"));
  }
  row2.appendChild(twCard);
  app.appendChild(row2);

  // Options flow bias verdict (secondary)
  app.appendChild(secLbl("Options Flow Bias"));
  const biasClass = intradayBiasClass(d.intraday_bias);
  const optHero = el("div", {className:"iday-hero " + biasClass});
  const optL = el("div");
  optL.appendChild(el("div", {className:"hero-eyebrow"}, "GEX / Entropy / PCA Classifier"));
  optL.appendChild(el("div", {className:"iday-label " + biasClass}, d.intraday_bias || "UNKNOWN"));
  optL.appendChild(el("span", {className:"iday-conf " + confidenceClass(d.confidence)},
    d.confidence || "—"));
  if (d.reason) {
    optL.appendChild(el("div", {className:"iday-reason"}, d.reason));
  }
  optHero.appendChild(optL);
  app.appendChild(optHero);

  // Macro Context
  app.appendChild(secLbl("Weekly Macro Context"));
  const macroCtx = el("div", {className:"g2"});
  const mcCard = card("Weekly Macro Bias");
  const mbias = d.macro_bias || "UNKNOWN";
  mcCard.appendChild(el("div", {className:"rname " + cc(mbias)}, mbias));
  if (d.macro_regime && d.macro_regime.name) {
    mcCard.appendChild(el("span", {className:"rscore"}, String(d.macro_regime.name)));
  }
  mcCard.appendChild(el("div", {className:"interp", style:{marginTop:"10px"}},
    "Weekly macro confluence from Layer 1. Used as tiebreaker in RTH bias scoring."));
  macroCtx.appendChild(mcCard);

  const lvlCtxCard = card("Vol Regime");
  const lvlReg = d.levels_regime || "UNKNOWN";
  lvlCtxCard.appendChild(el("div", {className:"lvls-regime " + regimeClass(lvlReg)}, lvlReg));
  lvlCtxCard.appendChild(kv("Classification",
    lvlReg === "EXPANSION" ? "IV≥30 or RV/IV<0.5" :
    lvlReg === "NEUTRAL"   ? "20≤IV<30" :
    lvlReg === "CONTRACTION" ? "IV<20" : "—",
    {color:"var(--ghost)", fontSize:"10px"}));
  macroCtx.appendChild(lvlCtxCard);
  app.appendChild(macroCtx);
}

// ── LOAD INTRADAY ──────────────────────────────────
let intradayLoaded         = false;
let intradayRefreshTimeout = null;
let intradayCountdownTimer = null;
let lastIntradayUpdate     = null;

function updateIntradayStatus() {
  const cdEl = document.getElementById("intraday-refresh-countdown");
  const upEl = document.getElementById("intraday-last-updated");
  if (!cdEl) return;
  const remaining = getNextFiveMinuteMark() - Date.now();
  cdEl.textContent = "Next refresh in " + formatDuration(remaining);
  cdEl.style.color = "var(--text)";
  if (upEl && lastIntradayUpdate) {
    upEl.textContent = "Last updated " + formatTimeET(lastIntradayUpdate);
  }
}

function scheduleIntradayRefresh() {
  if (intradayRefreshTimeout) clearTimeout(intradayRefreshTimeout);
  const ms = getNextFiveMinuteMark() - Date.now();
  intradayRefreshTimeout = setTimeout(function() {
    loadIntraday();
    scheduleIntradayRefresh();
  }, ms);
}

function startIntradayCountdown() {
  if (intradayCountdownTimer) clearInterval(intradayCountdownTimer);
  intradayCountdownTimer = setInterval(updateIntradayStatus, 1000);
  updateIntradayStatus();
}

function loadIntraday() {
  fetch("/.netlify/functions/intraday?_=" + Date.now(), {
    method: "GET",
    headers: {
      "Authorization": "Bearer " + localStorage.getItem("vanta_session")
    }
  })
    .then(function(r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function(d) {
      if (d && d.error) throw new Error(d.message || "intraday data unavailable");
      intradayLoaded     = true;
      lastIntradayUpdate = new Date();
      renderIntraday(d);
      startIntradayCountdown();
      scheduleIntradayRefresh();
    })
    .catch(function() {
      if (!intradayLoaded) {
        const app2 = document.getElementById("intraday-app");
        clearEl(app2);
        app2.appendChild(el("div", {className:"lvl-await"}, "Awaiting data…"));
      }
      startIntradayCountdown();
      scheduleIntradayRefresh();
    });
}

// ── INIT ──────────────────────────────────────────
// Swapped out direct static file reads for a curl-proof netlify route handler
fetch("/.netlify/functions/bias?_" + Date.now(), {
  method: "GET",
  headers: {
    "Authorization": "Bearer " + localStorage.getItem("vanta_session")
  }
})
  .then(function(r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function(d) {
    if (d && d.error) throw new Error(d.message || "macro data unavailable");
    render(d);
  })
  .catch(function(err) {
    const app = document.getElementById("app");
    clearEl(app);
    const d = el("div", {className:"err"});
    d.appendChild(el("p", {}, "Could not load engine data securely."));
    d.appendChild(el("p", {style:{marginTop:"8px",fontSize:"11px",color:"var(--muted)"}}, err.message));
    app.appendChild(d);
  });

loadLevels();
startCountdownTimer();   // 1s countdown ticker (independent of fetch outcome)
scheduleNextRefresh();   // self-sustaining minute-boundary refresh chain
loadIntraday();
initHashRouting();
</script>
