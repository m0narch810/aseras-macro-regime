<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vαntα · Futures Bias Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet">
<style>

/* ── TOKENS ──────────────────────────────────────── */
:root {
  --bg:          #060608;
  --bg-grid:     rgba(255,255,255,0.033);
  --surface:     rgba(255,255,255,0.032);
  --surface-hi:  rgba(255,255,255,0.058);

  --accent:      #c8d0dc;
  --accent-dim:  rgba(200,208,220,0.09);
  --accent-glow: rgba(200,208,220,0.14);
  --accent-sub:  rgba(200,208,220,0.55);

  --border:      rgba(255,255,255,0.088);
  --border-hi:   rgba(255,255,255,0.18);

  --text:  #f0f2f5;
  --muted: rgba(158,168,184,0.68);
  --ghost: rgba(100,110,126,0.56);

  --bull:      #34d399;
  --bull-dim:  rgba(52,211,153,0.08);
  --bull-b:    rgba(52,211,153,0.22);
  --bull-glow: rgba(52,211,153,0.28);

  --bear:      #f87171;
  --bear-dim:  rgba(248,113,113,0.08);
  --bear-b:    rgba(248,113,113,0.22);
  --bear-glow: rgba(248,113,113,0.28);

  /* mixed → red as requested */
  --mixed:      #ef4444;
  --mixed-dim:  rgba(239,68,68,0.08);
  --mixed-b:    rgba(239,68,68,0.2);
  --mixed-glow: rgba(239,68,68,0.22);
}

/* ── RESET ───────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

/* ── BASE ────────────────────────────────────────── */
body {
  background-color: var(--bg);
  background-image: radial-gradient(circle, var(--bg-grid) 1px, transparent 1px);
  background-size: 36px 36px;
  color: var(--text);
  font-family: 'JetBrains Mono', 'Courier New', monospace;
  font-size: 12.5px;
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── SCAN LINE ───────────────────────────────────── */
.scan-line {
  position: fixed; left: 0; width: 100%; height: 1px;
  background: linear-gradient(90deg,
    transparent 0%,
    rgba(255,255,255,0.03) 15%,
    rgba(255,255,255,0.1) 50%,
    rgba(255,255,255,0.03) 85%,
    transparent 100%
  );
  pointer-events: none; z-index: 0;
  animation: scan 16s linear infinite;
}
@keyframes scan {
  0%   { top: -2px; opacity: 0; }
  5%   { opacity: 1; }
  95%  { opacity: 1; }
  100% { top: 100vh; opacity: 0; }
}

/* ── PAGE WRAPPER ────────────────────────────────── */
.pw { position: relative; z-index: 1; }

/* ── HEADER ──────────────────────────────────────── */
header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 13px 32px;
  border-bottom: 1px solid var(--border);
  background: rgba(6,6,8,0.9);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  position: sticky; top: 0; z-index: 100;
}

.brand {
  font-family: 'Syne', sans-serif;
  font-weight: 800; font-size: 18px;
  letter-spacing: 0.14em;
  color: var(--text);
  user-select: none;
}
.brand .alph {
  color: #ffffff;
  text-shadow: 0 0 16px rgba(255,255,255,0.35);
}

.header-right { display: flex; align-items: center; gap: 22px; }

.hdr-tag {
  font-family: 'Syne', sans-serif;
  font-size: 8.5px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--ghost);
}

.live-dot {
  display: flex; align-items: center; gap: 7px;
  font-family: 'Syne', sans-serif;
  font-size: 8.5px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--ghost);
}
.live-dot::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: var(--bull);
  box-shadow: 0 0 8px var(--bull-glow);
  animation: blink 2.4s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.18; } }

/* ── MAIN ────────────────────────────────────────── */
main {
  max-width: 1160px; margin: 0 auto;
  padding: 22px 28px 44px;
}

/* ── ANIMATIONS ──────────────────────────────────── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── SECTION LABEL ───────────────────────────────── */
.sec-lbl {
  font-family: 'Syne', sans-serif;
  font-size: 8px; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--ghost);
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 10px;
}
.sec-lbl::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, rgba(255,255,255,0.1), transparent);
}

/* ── CARD ────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 18px 20px;
  opacity: 0;
  animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
  position: relative;
  overflow: hidden;
  transition: background 0.22s, border-color 0.22s;
}
.card::after {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 2px;
  background: rgba(255,255,255,0.5);
  opacity: 0;
  transition: opacity 0.22s;
}
.card:hover { background: var(--surface-hi); border-color: var(--border-hi); }
.card:hover::after { opacity: 0.35; }

.card-title {
  font-family: 'Syne', sans-serif;
  font-size: 7.5px; font-weight: 600;
  letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--ghost);
  margin-bottom: 14px; padding-bottom: 10px;
  border-bottom: 1px solid rgba(255,255,255,0.055);
}

/* ── GRIDS ───────────────────────────────────────── */
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.g3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
@media (max-width: 820px) { .g2,.g3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 540px) { .g2,.g3 { grid-template-columns: 1fr; } }

/* ── KV ROW ──────────────────────────────────────── */
.kv {
  display: flex; justify-content: space-between;
  align-items: baseline; gap: 8px; margin-bottom: 6px;
}
.kv:last-child { margin-bottom: 0; }
.kk { font-size: 9.5px; color: var(--ghost); white-space: nowrap; }

/* ── HERO ────────────────────────────────────────── */
#hero {
  padding: 32px 36px; margin-bottom: 10px;
  border: 1px solid var(--border); border-radius: 2px;
  display: flex; align-items: center;
  justify-content: space-between; gap: 20px;
  background: var(--surface);
  opacity: 0;
  animation: fadeUp 0.7s cubic-bezier(0.16,1,0.3,1) 0.03s forwards;
  position: relative; overflow: hidden;
}
#hero::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
}
#hero.bull::before  { background: var(--bull);  box-shadow: 4px 0 20px var(--bull-glow); }
#hero.bear::before  { background: var(--bear);  box-shadow: 4px 0 20px var(--bear-glow); }
#hero.mixed::before { background: var(--mixed); box-shadow: 4px 0 20px var(--mixed-glow); }
#hero::after {
  content: '';
  position: absolute; right: 20px; bottom: 16px;
  width: 16px; height: 16px;
  border-right: 1px solid rgba(255,255,255,0.14);
  border-bottom: 1px solid rgba(255,255,255,0.14);
}
#hero.bull  { border-color: rgba(52,211,153,0.24);  box-shadow: 0 0 60px rgba(52,211,153,0.05); }
#hero.bear  { border-color: rgba(248,113,113,0.24); box-shadow: 0 0 60px rgba(248,113,113,0.05); }
#hero.mixed { border-color: rgba(239,68,68,0.2);    box-shadow: 0 0 60px rgba(239,68,68,0.04); }

.hero-eyebrow {
  font-family: 'Syne', sans-serif;
  font-size: 8px; letter-spacing: 0.3em;
  text-transform: uppercase; color: var(--ghost); margin-bottom: 8px;
}
#hero-label {
  font-family: 'Syne', sans-serif;
  font-size: 54px; font-weight: 800;
  letter-spacing: 0.05em; line-height: 1;
}
#hero.bull  #hero-label { color: var(--bull);  text-shadow: 0 0 55px rgba(52,211,153,0.4); }
#hero.bear  #hero-label { color: var(--bear);  text-shadow: 0 0 55px rgba(248,113,113,0.4); }
#hero.mixed #hero-label { color: var(--mixed); text-shadow: 0 0 55px rgba(239,68,68,0.4); }

#hero-sub { margin-top: 10px; color: var(--muted); font-size: 10.5px; letter-spacing: 0.04em; }

#hero-right { text-align: right; flex-shrink: 0; }
.wlbl {
  font-family: 'Syne', sans-serif;
  font-size: 7.5px; letter-spacing: 0.22em;
  text-transform: uppercase; color: var(--ghost);
}
.wval { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

/* ── REGIME ──────────────────────────────────────── */
.rname {
  font-family: 'Syne', sans-serif;
  font-size: 19px; font-weight: 700;
  letter-spacing: 0.06em; margin-bottom: 4px;
}
.rname.bull  { color: var(--bull); }
.rname.bear  { color: var(--bear); }
.rname.mixed { color: var(--mixed); }

.rscore {
  font-size: 10px; color: var(--ghost);
  background: rgba(255,255,255,0.045);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 2px; padding: 2px 8px;
  display: inline-block; margin-bottom: 14px;
}

.factor-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
  gap: 5px; margin-top: 12px;
}
.fc {
  border-radius: 2px; padding: 5px 8px; font-size: 9.5px;
  display: flex; justify-content: space-between; align-items: center;
  border: 1px solid transparent; transition: box-shadow 0.2s;
}
.fc.pos  { background: var(--bull-dim);  border-color: var(--bull-b);  color: var(--bull); }
.fc.neg  { background: var(--bear-dim);  border-color: var(--bear-b);  color: var(--bear); }
.fc.zero { background: rgba(255,255,255,0.025); border-color: rgba(255,255,255,0.08); color: var(--ghost); }
.fc.pos:hover  { box-shadow: 0 0 14px var(--bull-glow); }
.fc.neg:hover  { box-shadow: 0 0 14px var(--bear-glow); }
.fc .fn { font-size: 8.5px; opacity: 0.72; }
.fc .fv { font-weight: 700; font-size: 11px; }

/* ── DIRECTION ───────────────────────────────────── */
.dirb {
  font-family: 'Syne', sans-serif;
  font-size: 28px; font-weight: 800;
  letter-spacing: 0.06em; margin-bottom: 4px;
}
.dirb.bull { color: var(--bull); text-shadow: 0 0 24px rgba(52,211,153,0.44); }
.dirb.bear { color: var(--bear); text-shadow: 0 0 24px rgba(248,113,113,0.44); }

.pbar-w { height: 3px; background: rgba(255,255,255,0.06); border-radius: 1px; margin: 10px 0; }
.pbar   { height: 3px; border-radius: 1px; }
.pbar.bull { background: linear-gradient(90deg, rgba(52,211,153,.3), var(--bull)); box-shadow: 0 0 7px var(--bull-glow); }
.pbar.bear { background: linear-gradient(90deg, rgba(248,113,113,.3), var(--bear)); box-shadow: 0 0 7px var(--bear-glow); }

/* ── VIX BADGE ───────────────────────────────────── */
.vbadge {
  display: inline-block;
  font-family: 'Syne', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 0.14em; text-transform: uppercase;
  border-radius: 2px; padding: 3px 12px;
  margin-bottom: 12px; border: 1px solid transparent;
}
.vbadge.back { background: var(--bear-dim); border-color: var(--bear-b); color: var(--bear); box-shadow: 0 0 12px var(--bear-glow); }
.vbadge.cont { background: var(--bull-dim); border-color: var(--bull-b); color: var(--bull); box-shadow: 0 0 12px var(--bull-glow); }

/* ── COT BAR ─────────────────────────────────────── */
.pb-w { height: 4px; background: rgba(255,255,255,0.05); border-radius: 1px; margin: 8px 0; position: relative; }
.pb-f { height: 4px; border-radius: 1px; }
.pb-m { position: absolute; top: -4px; width: 1px; height: 12px; background: rgba(255,255,255,0.22); }

/* ── KEY LEVELS ──────────────────────────────────── */
.lvl-tbl { width: 100%; border-collapse: collapse; }
.lvl-tbl td { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.044); }
.lvl-tbl tr:last-child td { border-bottom: none; }
.ln { font-size: 10px; color: var(--muted); }
.lv { text-align: right; font-size: 13px; color: var(--accent-sub); }
.lv.hi { color: var(--text) !important; font-weight: 500; text-shadow: 0 0 10px rgba(255,255,255,0.22); }

/* ── ACCURACY STRIP ──────────────────────────────── */
.acc {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 20px 28px; margin-bottom: 10px;
  display: flex; gap: 0;
  opacity: 0;
  animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
}
.as { flex: 1; padding: 0 24px; }
.as:first-child { padding-left: 0; }
.as:last-child  { padding-right: 0; }
.as + .as { border-left: 1px solid rgba(255,255,255,0.07); }
.al { font-family: 'Syne', sans-serif; font-size: 7.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ghost); }
.av { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; margin: 4px 0 2px; }
.as2 { font-size: 9.5px; color: var(--muted); }

/* ── HISTORY ─────────────────────────────────────── */
table.hist { width: 100%; border-collapse: collapse; font-size: 11px; }
.hist th {
  text-align: left;
  font-family: 'Syne', sans-serif;
  font-size: 7.5px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ghost); padding: 10px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.08); font-weight: 600;
}
.hist td {
  padding: 7px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.035);
  transition: background 0.15s;
}
.hist tr:hover td { background: rgba(255,255,255,0.022); }
.hist tr:last-child td { border-bottom: none; }

/* ── TAGS ────────────────────────────────────────── */
.tag {
  display: inline-block; border-radius: 2px;
  padding: 1px 7px;
  font-family: 'Syne', sans-serif;
  font-size: 8.5px; font-weight: 700;
  letter-spacing: 0.07em;
  border: 1px solid transparent; white-space: nowrap;
}
.tag.bull  { background: var(--bull-dim);  border-color: var(--bull-b);  color: var(--bull); }
.tag.bear  { background: var(--bear-dim);  border-color: var(--bear-b);  color: var(--bear); }
.tag.mixed { background: var(--mixed-dim); border-color: var(--mixed-b); color: var(--mixed); }

/* ── INTERPRETATION BOX ──────────────────────────── */
.interp {
  margin-top: 10px; padding: 8px 10px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 2px;
  font-size: 11px; color: var(--muted);
  font-style: italic;
}

/* ── FOOTER ──────────────────────────────────────── */
footer {
  position: relative; z-index: 1;
  text-align: center; color: var(--ghost);
  font-size: 9.5px; letter-spacing: 0.08em;
  padding: 26px 24px;
  border-top: 1px solid rgba(255,255,255,0.05); margin-top: 32px;
}
footer .alph { color: rgba(255,255,255,0.55); }

/* ── MISC ────────────────────────────────────────── */
.loading {
  color: var(--ghost); text-align: center; padding: 80px;
  font-family: 'Syne', sans-serif; letter-spacing: 0.26em;
  font-size: 11px; text-transform: uppercase;
}
.err { color: var(--bear); text-align: center; padding: 80px; }

::-webkit-scrollbar { width: 3px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.16); border-radius: 1px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.28); }

</style>
</head>
<body>

<div class="scan-line"></div>

<div class="pw">

  <header>
    <div class="brand">v<span class="alph">&#945;</span>nt<span class="alph">&#945;</span></div>
    <div class="header-right">
      <div class="hdr-tag" id="meta-ts"></div>
      <div class="live-dot">Live</div>
    </div>
  </header>

  <main id="app"><div class="loading">Initializing&hellip;</div></main>

  <footer>
    NQ &middot; ES Equity Index Futures &nbsp;&middot;&nbsp; Weekly timeframe only &nbsp;&middot;&nbsp; Not financial advice
    &nbsp;&mdash;&nbsp;
    v<span class="alph">&#945;</span>nt<span class="alph">&#945;</span> Bias Engine
  </footer>

</div>

<script>
// ── HISTORICAL DATA ────────────────────────────────
const HIST = [
  { date:"2026-02-05", regime:"LEAN RISK-OFF", score:-1, dir:"BULLISH", prob:0.502, vol:0.0172, conf:"LEAN BEAR" },
  { date:"2026-02-12", regime:"LEAN RISK-OFF", score:-2, dir:"BULLISH", prob:0.502, vol:0.0156, conf:"LEAN BEAR" },
  { date:"2026-02-19", regime:"TRANSITION",    score: 0, dir:"BULLISH", prob:0.508, vol:0.0134, conf:"MIXED" },
  { date:"2026-02-26", regime:"TRANSITION",    score: 0, dir:"BEARISH", prob:0.495, vol:0.0164, conf:"MIXED" },
  { date:"2026-03-05", regime:"LEAN RISK-ON",  score: 1, dir:"BEARISH", prob:0.495, vol:0.0145, conf:"LEAN BULL" },
  { date:"2026-03-12", regime:"LEAN RISK-OFF", score:-1, dir:"BEARISH", prob:0.495, vol:0.0152, conf:"LEAN BEAR" },
  { date:"2026-03-19", regime:"RISK-OFF",      score:-4, dir:"BEARISH", prob:0.495, vol:0.0152, conf:"LEAN BEAR" },
  { date:"2026-03-26", regime:"RISK-OFF",      score:-3, dir:"BEARISH", prob:0.495, vol:0.0177, conf:"LEAN BEAR" },
  { date:"2026-04-02", regime:"RISK-OFF",      score:-4, dir:"BEARISH", prob:0.495, vol:0.0181, conf:"LEAN BEAR" },
  { date:"2026-04-09", regime:"RISK-OFF",      score:-4, dir:"BULLISH", prob:0.502, vol:0.0177, conf:"LEAN BEAR" },
  { date:"2026-04-16", regime:"RISK-ON",       score: 4, dir:"BEARISH", prob:0.499, vol:0.0165, conf:"LEAN BULL" },
  { date:"2026-04-23", regime:"RISK-ON",       score: 5, dir:"BEARISH", prob:0.499, vol:0.0141, conf:"LEAN BULL" },
  { date:"2026-04-30", regime:"LEAN RISK-ON",  score: 1, dir:"BEARISH", prob:0.499, vol:0.0140, conf:"LEAN BULL" },
  { date:"2026-05-07", regime:"LEAN RISK-ON",  score: 1, dir:"BEARISH", prob:0.499, vol:0.0169, conf:"LEAN BULL" },
  { date:"2026-05-14", regime:"RISK-ON",       score: 4, dir:"BEARISH", prob:0.499, vol:0.0140, conf:"LEAN BULL" },
  { date:"2026-05-21", regime:"LEAN RISK-OFF", score:-2, dir:"BEARISH", prob:0.499, vol:0.0137, conf:"LEAN BEAR" },
];

// ── HELPERS ───────────────────────────────────────
function cc(v) {
  if (!v) return "mixed";
  const u = String(v).toUpperCase();
  if (u.includes("BULL") || u.includes("RISK-ON")) return "bull";
  if (u.includes("BEAR") || u.includes("RISK-OFF")) return "bear";
  return "mixed";
}
function dc(v) { return String(v).toUpperCase().includes("BULL") ? "bull" : "bear"; }
function sgn(v) { return (v >= 0 ? "+" : "") + v; }
function fc(v)  { return v > 0 ? "pos" : v < 0 ? "neg" : "zero"; }
function pct(v, d) { return (v * 100).toFixed(d === undefined ? 1 : d) + "%"; }
function txt(v) { return document.createTextNode(String(v)); }

// ── DOM HELPERS ───────────────────────────────────
function el(tag, attrs) {
  const e = document.createElement(tag);
  const children = Array.prototype.slice.call(arguments, 2);
  for (const k in (attrs || {})) {
    if (k === "className") e.className = attrs[k];
    else if (k === "style") Object.assign(e.style, attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (let i = 0; i < children.length; i++) {
    const c = children[i];
    if (c == null) continue;
    e.appendChild(typeof c === "string" ? txt(c) : c);
  }
  return e;
}
function kv(key, val, valStyle) {
  const r = el("div", {className:"kv"});
  r.appendChild(el("span", {className:"kk"}, key));
  r.appendChild(el("span", valStyle ? {style:valStyle} : {}, val));
  return r;
}
function tagEl(text, cls) { return el("span", {className:"tag " + cls}, text); }
function barEl(pct_val, cls) {
  const w = el("div", {className:"pbar-w"});
  const f = el("div", {className:"pbar " + cls});
  f.style.width = Math.max(3, Math.min(100, pct_val)) + "%";
  w.appendChild(f);
  return w;
}
function clearEl(node) { while (node.firstChild) node.removeChild(node.firstChild); }

let _ci = 0;
function card(titleText) {
  const children = Array.prototype.slice.call(arguments, 1);
  const c = el("div", {className:"card"});
  c.style.animationDelay = (_ci++ * 0.1) + "s";
  c.appendChild(el("div", {className:"card-title"}, titleText));
  for (let i = 0; i < children.length; i++) {
    if (children[i]) c.appendChild(children[i]);
  }
  return c;
}
function secLbl(text) { return el("div", {className:"sec-lbl"}, text); }

// ── RENDER ────────────────────────────────────────
function render(d) {
  _ci = 0;
  const app = document.getElementById("app");
  clearEl(app);

  const mr  = d.macro_regime;
  const pm  = d.price_model;
  const vf  = d.vol_forecast;
  const cot = d.cot;
  const vts = d.vix_term_structure;
  const kl  = d.key_levels;
  const meta = d.meta;
  const confluence = d.confluence;

  document.getElementById("meta-ts").textContent =
    "Generated " + (meta.generated_at || "—");

  // ── HERO ──
  const hero = el("div", {id:"hero", className: cc(confluence)});
  const heroL = el("div");
  heroL.appendChild(el("div", {className:"hero-eyebrow"}, "Weekly Confluence"));
  heroL.appendChild(el("div", {id:"hero-label"}, String(confluence)));
  heroL.appendChild(el("div", {id:"hero-sub"},
    String(meta.instrument || "NQ / ES") + " · Macro Regime + Price Model"));
  const heroR = el("div", {id:"hero-right"});
  heroR.appendChild(el("div", {className:"wlbl"}, "Analysis Window"));
  heroR.appendChild(el("div", {className:"wval"},
    String(meta.week_start) + " → " + String(meta.week_end)));
  hero.appendChild(heroL);
  hero.appendChild(heroR);
  app.appendChild(hero);

  // ── ROW 1 ──
  app.appendChild(secLbl("Signal Breakdown"));
  const row1 = el("div", {className:"g3"});

  // Macro Regime
  const macroCard = card("Macro Regime");
  const rDiv = el("div", {style:{marginBottom:"14px"}});
  rDiv.appendChild(el("div", {className:"rname " + cc(mr.name)}, String(mr.name)));
  rDiv.appendChild(el("span", {className:"rscore"},
    "Score " + sgn(mr.score) + " / " + mr.max_score));
  macroCard.appendChild(rDiv);
  macroCard.appendChild(kv("Bullish inputs",
    (mr.bullish_inputs || []).join(", ") || "—", {color:"var(--bull)"}));
  macroCard.appendChild(kv("Bearish inputs",
    (mr.bearish_inputs || []).join(", ") || "—", {color:"var(--bear)"}));
  const fg = el("div", {className:"factor-grid"});
  const fs = mr.factor_scores || {};
  for (const k in fs) {
    if (!Object.prototype.hasOwnProperty.call(fs, k)) continue;
    const v = fs[k];
    const chip = el("div", {className:"fc " + fc(v)});
    chip.appendChild(el("span", {className:"fn"}, k.replace(/_/g," ")));
    chip.appendChild(el("span", {className:"fv"}, sgn(v)));
    fg.appendChild(chip);
  }
  macroCard.appendChild(fg);
  row1.appendChild(macroCard);

  // Price Model
  const priceCard = card("Price Model");
  priceCard.appendChild(el("div", {className:"dirb " + dc(pm.direction)}, String(pm.direction)));
  priceCard.appendChild(el("div", {style:{color:"var(--muted)",fontSize:"11px",marginBottom:"4px"}},
    "Probability: " + (pm.probability * 100).toFixed(1) + "%"));
  priceCard.appendChild(barEl(pm.probability * 100, dc(pm.direction)));
  priceCard.appendChild(kv("Confidence",
    pm.probability > 0.55 || pm.probability < 0.45 ? "Moderate" : "Low"));
  row1.appendChild(priceCard);

  // Vol Forecast
  const volCard = card("Vol Forecast");
  volCard.appendChild(el("div", {className:"dirb", style:{color:"var(--accent)"}},
    vf.weekly_vol_pct.toFixed(1) + "%"));
  volCard.appendChild(el("div", {style:{color:"var(--muted)",fontSize:"11px",marginBottom:"8px"}},
    "Weekly realized vol estimate"));
  volCard.appendChild(kv("Percentile", vf.percentile + "th"));
  volCard.appendChild(kv("Label", String(vf.label)));
  const volBar = el("div", {className:"pbar-w"});
  const volFill = el("div", {className:"pbar"});
  volFill.style.width = Math.max(3, vf.percentile) + "%";
  volFill.style.background = "linear-gradient(90deg, rgba(200,208,220,0.2), var(--accent))";
  volFill.style.boxShadow = "0 0 7px rgba(200,208,220,0.2)";
  volBar.appendChild(volFill);
  volCard.appendChild(volBar);
  row1.appendChild(volCard);
  app.appendChild(row1);

  // ── ROW 2 ──
  app.appendChild(secLbl("Market Structure"));
  const row2 = el("div", {className:"g3"});

  // COT
  const cotCard = card("COT Positioning · " + String(cot.as_of || "—"));
  const pctile = cot.nq_lev_pctile;
  const pColor = pctile > 0.8 ? "var(--bull)" : pctile < 0.2 ? "var(--bear)" : "var(--text)";
  cotCard.appendChild(kv("NQ Lev Funds",
    String(cot.lev_label) + " (" + (pctile * 100).toFixed(0) + "th)", {color:pColor}));
  const pbw = el("div", {className:"pb-w"});
  const pbf = el("div", {className:"pb-f"});
  pbf.style.width = (pctile * 100) + "%";
  pbf.style.background = pctile > 0.8 ? "var(--bull)" : pctile < 0.2 ? "var(--bear)" : "var(--accent)";
  pbw.appendChild(pbf);
  const pm1 = el("div", {className:"pb-m"}); pm1.style.left = "20%";
  const pm2 = el("div", {className:"pb-m"}); pm2.style.left = "80%";
  pbw.appendChild(pm1); pbw.appendChild(pm2);
  cotCard.appendChild(pbw);
  const wow = cot.nq_lev_wow;
  cotCard.appendChild(kv("NQ Lev WoW",
    (wow >= 0 ? "+" : "") + (wow * 100).toFixed(2) + "% OI",
    {color: wow >= 0 ? "var(--bull)" : "var(--bear)"}));
  const amn = cot.es_asset_mgr_net_pct;
  cotCard.appendChild(kv("ES Asset Mgr Net",
    (amn >= 0 ? "+" : "") + (amn * 100).toFixed(1) + "% OI",
    {color: amn >= 0 ? "var(--bull)" : "var(--bear)"}));
  cotCard.appendChild(el("div", {className:"interp"}, String(cot.positioning_interpretation || "—")));
  row2.appendChild(cotCard);

  // VIX Term Structure
  const vtsCard = card("VIX Term Structure");
  vtsCard.appendChild(el("div",
    {className:"vbadge " + (vts.structure === "BACKWARDATION" ? "back" : "cont")},
    String(vts.structure)));
  vtsCard.appendChild(kv("VIX / VIX3M", vts.vix_ratio.toFixed(3)));
  vtsCard.appendChild(kv("Mood", String(vts.mood).toUpperCase(),
    {color: vts.mood === "stress" ? "var(--bear)" : "var(--bull)"}));
  vtsCard.appendChild(kv("VVIX", vts.vvix.toFixed(1)));
  const rw = vts.ratio_wow;
  vtsCard.appendChild(kv("Ratio WoW",
    (rw >= 0 ? "+" : "") + rw.toFixed(3) + " → " + String(vts.bias),
    {color: rw > 0 ? "var(--bear)" : "var(--bull)"}));
  row2.appendChild(vtsCard);

  // Key Levels
  const lvlCard = card("Key Levels · NQ");
  const tbl = el("table", {className:"lvl-tbl"});
  const levels = [
    ["4-Week High",     "4w_high",  true],
    ["Prev Week High",  "pw_high",  false],
    ["Prev Week Close", "pw_close", true],
    ["Prev Week Mid",   "pw_mid",   false],
    ["Prev Week Low",   "pw_low",   false],
    ["4-Week Low",      "4w_low",   true],
    ["ATR 5-day",       "atr_5d",   false],
    ["ATR 20-day",      "atr_20d",  false],
  ];
  for (let i = 0; i < levels.length; i++) {
    const name = levels[i][0], key = levels[i][1], hi = levels[i][2];
    const tr = el("tr");
    tr.appendChild(el("td", {className:"ln"}, name));
    const val = kl[key];
    tr.appendChild(el("td", {className:"lv" + (hi ? " hi" : "")},
      val != null ? val.toFixed(2) : "—"));
    tbl.appendChild(tr);
  }
  lvlCard.appendChild(tbl);
  row2.appendChild(lvlCard);
  app.appendChild(row2);

  // ── ACCURACY BANNER ──
  app.appendChild(secLbl("Model Performance — Feb to May 2026"));
  const accData = [
    ["Directional Accuracy", "76.9%",  "13 tradeable calls",          "var(--bull)"],
    ["RISK-ON Accuracy",     "100%",   "Perfect in full risk-on",      "var(--bull)"],
    ["LEAN BULL Accuracy",   "5 / 5",  "All lean bull calls correct",  "var(--bull)"],
    ["Misses",               "2",      "April 2026 tariff catalyst",   "var(--muted)"],
  ];
  const acc = el("div", {className:"acc"});
  acc.style.animationDelay = (_ci++ * 0.1) + "s";
  for (let i = 0; i < accData.length; i++) {
    const lbl = accData[i][0], val = accData[i][1],
          sub = accData[i][2], color = accData[i][3];
    const as = el("div", {className:"as"});
    as.appendChild(el("div", {className:"al"}, lbl));
    as.appendChild(el("div", {className:"av", style:{color:color}}, val));
    as.appendChild(el("div", {className:"as2"}, sub));
    acc.appendChild(as);
  }
  app.appendChild(acc);

  // ── HISTORY TABLE ──
  app.appendChild(secLbl("Blind Prediction History"));
  const hcard = el("div", {className:"card"});
  hcard.style.padding = "0";
  hcard.style.overflow = "hidden";
  hcard.style.animationDelay = (_ci++ * 0.1) + "s";
  const htbl = el("table", {className:"hist"});
  const thead = el("thead");
  const htr = el("tr");
  const headers = ["Week Of","Regime","Score","Price Dir","Prob","Vol Est","Confluence"];
  for (let i = 0; i < headers.length; i++) {
    htr.appendChild(el("th", {}, headers[i]));
  }
  thead.appendChild(htr);
  htbl.appendChild(thead);
  const tbody = el("tbody");
  for (let i = 0; i < HIST.length; i++) {
    const h = HIST[i];
    const tr = el("tr");
    tr.appendChild(el("td", {}, h.date));
    const rtd = el("td"); rtd.appendChild(tagEl(h.regime, cc(h.regime))); tr.appendChild(rtd);
    const scoreColor = h.score > 0 ? "var(--bull)" : h.score < 0 ? "var(--bear)" : "var(--muted)";
    tr.appendChild(el("td", {style:{color:scoreColor}}, sgn(h.score)));
    const dtd = el("td"); dtd.appendChild(tagEl(h.dir, dc(h.dir))); tr.appendChild(dtd);
    tr.appendChild(el("td", {style:{color:"var(--muted)"}}, pct(h.prob)));
    tr.appendChild(el("td", {style:{color:"var(--muted)"}}, pct(h.vol, 2)));
    const ctd = el("td"); ctd.appendChild(tagEl(h.conf, cc(h.conf))); tr.appendChild(ctd);
    tbody.appendChild(tr);
  }
  htbl.appendChild(tbody);
  hcard.appendChild(htbl);
  app.appendChild(hcard);
}

// ── INIT ──────────────────────────────────────────
fetch("bias_output.json")
  .then(function(r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(render)
  .catch(function(err) {
    const app = document.getElementById("app");
    clearEl(app);
    const d = el("div", {className:"err"});
    d.appendChild(el("p", {}, "Could not load bias_output.json"));
    d.appendChild(el("p", {style:{marginTop:"8px",fontSize:"11px",color:"var(--muted)"}}, err.message));
    d.appendChild(el("p", {style:{marginTop:"4px",fontSize:"11px",color:"var(--muted)"}},
      "Ensure bias_output.json is in the same directory as index.html."));
    app.appendChild(d);
  });
</script>

</body>
</html>
