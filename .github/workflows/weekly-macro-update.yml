name: Weekly Macro Bias Update

on:
  schedule:
    # Daily pre-market refresh Mon-Fri at 13:00 UTC (9:00 AM EDT / 8:00 AM EST)
    # Updates bias_output.json with fresh VIX/DXY/yield readings before RTH open
    - cron: '0 13 * * 1-5'
    # Friday 10 PM UTC — full weekly update after CFTC COT release (3:30 PM ET)
    - cron: '0 22 * * 5'
  workflow_dispatch:   # manual trigger from the Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-bias:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly bias report
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/05_weekly_report.py --live

      - name: Commit bias_output.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bias_output.json
          git diff --cached --quiet -- bias_output.json \
            || git commit -m "chore: macro bias refresh $(date -u +%Y-%m-%d)"
          git push
