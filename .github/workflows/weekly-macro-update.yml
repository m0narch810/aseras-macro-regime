name: Weekly Macro Bias Update

on:
  schedule:
    # Friday 10 PM UTC = 5 PM EST / 6 PM EDT — always after CFTC COT release (3:30 PM ET)
    - cron: '0 22 * * 5'
  workflow_dispatch:   # manual trigger from the Actions tab

jobs:
  update-bias:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly bias report
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/05_weekly_report.py --live

      - name: Commit bias_output.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bias_output.json
          git diff --cached --quiet -- bias_output.json \
            || git commit -m "chore: weekly macro bias $(date -u +%Y-%m-%d)"
          git push
